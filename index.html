<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Генератор вечера · Москва</title>
<meta name="description" content="Собирает план на вечер из реальных мест и событий Москвы.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,500&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#17130f; --panel:#211b16; --panel2:#2a231c; --line:#3a3027;
  --text:#f3e9dc; --muted:#a8998a; --accent:#f0a24a; --accent2:#e86f4c; --glow:rgba(240,162,74,.18);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(1200px 600px at 80% -10%,#3a2615 0%,transparent 60%),radial-gradient(900px 500px at -10% 110%,#2b1a24 0%,transparent 60%),var(--bg);
  color:var(--text);font-family:Manrope,system-ui,sans-serif;min-height:100vh;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding:48px 20px 60px}
header{text-align:center;margin-bottom:36px}
.kicker{letter-spacing:.25em;text-transform:uppercase;font-size:12px;color:var(--accent)}
h1{font-family:"Playfair Display",serif;font-weight:600;font-size:clamp(38px,6vw,64px);line-height:1.05;margin:10px 0 12px}
h1 em{font-style:italic;font-weight:500;color:var(--accent)}
.sub{color:var(--muted);max-width:560px;margin:0 auto}
.controls{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px 22px 8px}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px}
.label{width:110px;flex-shrink:0;color:var(--muted);font-size:13px;text-transform:uppercase;letter-spacing:.08em}
.chips{display:flex;flex-wrap:wrap;gap:8px;flex:1;align-items:center}
.chip{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:8px 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer;transition:.15s}
.chip:hover{border-color:#5a4836}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#1a120a;font-weight:700}
.outonly[hidden]{display:none}
.metro{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:8px 14px;border-radius:999px;font:inherit;font-size:14px;width:210px;max-width:100%}
.metro::placeholder{color:var(--muted)}
.metro:focus{outline:none;border-color:var(--accent)}
.where{color:var(--accent);font-size:13px;width:100%;padding-left:120px;margin-top:-8px}
.go{display:block;margin:26px auto 34px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#1a0f07;border:0;
  font:700 18px Manrope,sans-serif;padding:16px 38px;border-radius:999px;cursor:pointer;box-shadow:0 10px 40px var(--glow);transition:transform .15s}
.go:hover{transform:translateY(-2px)}
.go:active{transform:translateY(0)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;position:relative;min-height:160px;display:flex;flex-direction:column}
.card.locked{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.ctop{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
.ctitle{font-size:12px;text-transform:uppercase;letter-spacing:.14em;color:var(--accent)}
.btns{display:flex;gap:6px}
.ib{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);color:var(--text);cursor:pointer;font-size:15px;display:grid;place-items:center}
.ib:hover{border-color:var(--accent)}
.ib[aria-pressed="true"]{background:var(--accent);color:#1a120a;border-color:var(--accent)}
.main{font-family:"Playfair Display",serif;font-size:22px;line-height:1.25;margin-bottom:6px;overflow-wrap:anywhere}
.note{color:var(--muted);font-size:14px}
.guide{font-size:12px;font-weight:700;color:#1a120a;background:linear-gradient(135deg,#f6c76b,var(--accent));border-radius:10px;padding:5px 10px;margin-bottom:10px;line-height:1.35}
.tag{display:inline-block;font-size:12px;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:2px 10px;margin:0 6px 8px 0}
.meta{font-size:14px;color:var(--text);margin-top:8px;display:grid;gap:3px}
.meta span{color:var(--muted)}
.links{margin-top:auto;padding-top:14px;display:flex;flex-wrap:wrap;gap:8px}
.links a{color:#1a120a;background:var(--accent);text-decoration:none;font-size:13px;font-weight:700;padding:7px 12px;border-radius:999px}
.links a.sec{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:500}
.links a:hover{filter:brightness(1.1);border-color:var(--accent)}
.card.fade .main,.card.fade .note,.card.fade .meta{animation:in .45s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card.wide{grid-column:1/-1;background:linear-gradient(135deg,#2c2016,#2a1b20);min-height:0}
.foot{display:flex;justify-content:center;gap:10px;margin-top:22px;flex-wrap:wrap}
.ghost{border:1px solid var(--line);background:transparent;color:var(--text);padding:10px 18px;border-radius:999px;font:inherit;cursor:pointer}
.ghost:hover{border-color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:30px 0}
.banner{background:var(--panel2);border:1px dashed var(--accent);color:var(--text);border-radius:14px;padding:12px 16px;font-size:14px;margin-bottom:16px}
.credits{margin-top:48px;text-align:center;color:var(--muted);font-size:12px;line-height:1.7}
.credits a{color:var(--muted)}
.topnav{display:flex;justify-content:flex-end;gap:8px;margin:-24px 0 18px}
.ghost.small{padding:7px 14px;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(10,8,6,.72);display:flex;align-items:flex-start;justify-content:center;padding:40px 14px;z-index:10;overflow:auto}
.modal[hidden]{display:none}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:20px;width:100%;max-width:720px;padding:22px}
.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.sheet h2{font-family:"Playfair Display",serif;font-weight:600;font-size:28px}
.sheet h3{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);margin:18px 0 8px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.fitem{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;border-top:1px solid var(--line);padding:12px 0}
.fitem .ft{font-weight:700}.fitem .fs{color:var(--muted);font-size:13px;white-space:pre-line}
.fitem a{color:var(--accent);font-size:13px}
.field{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.field input,.field textarea{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:9px 12px;font:inherit;font-size:14px}
.field textarea{width:100%;min-height:70px;font-size:12px}
.muted{color:var(--muted);font-size:14px}
.ib.fav[aria-pressed="true"]{background:#e8556b;border-color:#e8556b;color:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--accent);color:#1a120a;padding:10px 18px;border-radius:12px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (max-width:560px){.label{width:100%}.wrap{padding-top:32px}.where{padding-left:0;margin-top:0}}
</style>
</head>
<body>
<div class="wrap">
  <nav class="topnav">
    <button class="ghost small" id="openFav">❤️ Избранное <span id="favCount"></span></button>
    <button class="ghost small" id="openSet">⚙️ Настройки</button>
  </nav>
  <header>
    <div class="kicker">Москва · сегодня вечером</div>
    <h1>Генератор <em>вечера</em></h1>
    <p class="sub">Выберите настроение, а я соберу план. Дома — фильм, ужин и занятие. В городе — реальные места и события Москвы с адресами и ссылкой на отзывы.</p>
  </header>

  <div id="banner"></div>
  <section class="controls" id="controls"></section>

  <button class="go" id="go">✨ Собрать вечер</button>

  <section id="out"><p class="empty">Нажмите кнопку, и вечер сложится сам. Понравившиеся пункты можно закрепить 🔒, а остальные перекрутить ↻.</p></section>

  <div class="foot" id="foot" hidden>
    <button class="ghost" id="savePlan">💾 Сохранить вечер</button>
    <button class="ghost" id="copy">📋 Скопировать план</button>
    <button class="ghost" id="reset">Снять все замки</button>
    <button class="ghost" id="unhide" hidden></button>
  </div>

  <div class="credits" id="credits"></div>
</div>
<div class="modal" id="modal" hidden><div class="sheet" role="dialog" aria-modal="true">
  <div class="sheethead"><h2 id="mTitle"></h2><button class="ib" id="mClose" aria-label="Закрыть">✕</button></div>
  <div id="mBody"></div>
</div></div>
<datalist id="metrolist"></datalist>
<div class="toast" id="toast"></div>

function avgCheck(p){
  const t = CHECK[p.k]; if(!t) return '';

  fun:    {bowling:3,karaoke:3,quest:3,arcade:2,rink:2,comedy:3,trampoline:2,club:1,anticafe:2,waterpark:1,cinema:1,fun:2},
  romance:{theatre:3,planetarium:3,gallery:2,viewpoint:3,rink:2,park:2,concert:2,cinema:2,museum:1},
  deep:   {museum:3,gallery:3,theatre:3,planetarium:2,arts:2,books:2,concert:2},
  adv:    {quest:3,climbing:3,rink:2,viewpoint:2,attraction:2,zoo:1,waterpark:2,trampoline:2,arcade:1,fun:2},
};
const ACTIVE = ['rink','climbing','trampoline','waterpark','quest','bowling'];
const FREEISH = {park:3,viewpoint:3,attraction:2,books:2,gallery:1,museum:1};
const EVENT_MOOD = {
  cozy:['exhibition','cinema','lecture','workshop'],
  fun:['show','party','quest','festival','concert','sport'],
  romance:['concert','theater','exhibition','show'],
  deep:['theater','exhibition','lecture','tour'],
  adv:['quest','tour','festival','sport','workshop'],
};
const EVENT_KIND = {exhibition:'Выставка',theater:'Спектакль',concert:'Концерт',tour:'Экскурсия',workshop:'Мастер-класс',
  lecture:'Лекция или встреча',quest:'Квест или игра',cinema:'Кино',festival:'Фестиваль',sport:'Спорт',kids:'Детям',
  park:'В парке',show:'Шоу',party:'Вечеринка',other:'Событие'};

const maxPc = () => state.budget==='free' ? 0 : state.budget==='low' ? 1 : 3;
function wantSets(){
  const places = new Set(), events = new Set();
  WANT.filter(w=>state.want.includes(w[0])).forEach(w=>{ w[2].forEach(x=>places.add(x)); w[3].forEach(x=>events.add(x)); });
  return {places, events, on: state.want.length>0};
}
function activityWeights(){
  const mood = MOOD_W[state.mood], ws = wantSets();
  let w = {};
  if(ws.on){ ws.places.forEach(k=>{ w[k] = 1 + (mood[k]||0); }); }       // явные пожелания важнее настроения
  else {
    w = Object.assign({}, mood);
    if(state.budget==='free') Object.keys(FREEISH).forEach(k=>{ w[k] = (w[k]||0) + FREEISH[k]; });
    if(state.who==='family') Object.assign(w,{zoo:2,planetarium:2,museum:2}, state.energy!=='low'?{trampoline:2}:{});
    if(state.who==='solo') ['quest','bowling','karaoke'].forEach(k=>{ if(w[k]) w[k]*=.3; });
    if(state.energy==='low') ACTIVE.forEach(k=>delete w[k]);
    if(state.energy==='high') ACTIVE.forEach(k=>{ if(w[k]) w[k]*=2; });
  }
  if(state.who==='family') ['club','karaoke','comedy','banya'].forEach(k=>delete w[k]);
  return w;
}
function cuisineKeys(){ return CUISINES.find(c=>c[0]===state.cuisine)[2]; }
function foodWeights(){
  let w;
  if(state.budget==='free') w = {cafe:3,market:2};
  else if(state.budget==='low') w = {cafe:3,market:2,restaurant:2,bar:1};
  else w = {restaurant:4,bar:1,market:1,cafe:.5};
  if(state.mood==='romance' && state.budget==='high'){ w.restaurant+=2; delete w.market; }
  if(state.mood==='fun' && state.budget!=='free') w.bar=(w.bar||0)+2;
  if(state.who==='friends' && state.budget!=='free') w.bar=(w.bar||0)+1;
  if(state.who==='solo') w.cafe=(w.cafe||0)+2;
  if(cuisineKeys().length){ ['restaurant','cafe','bar','market'].forEach(k=>{ if(!w[k] && !(state.budget==='free'&&(k==='restaurant'||k==='bar'))) w[k]=1; }); }
  if(state.who==='family') delete w.bar;
  return w;
}

function dist(a,b,c,d){ const p=Math.PI/180, x=(d-b)*p*Math.cos((a+c)/2*p), y=(c-a)*p; return 6371*Math.sqrt(x*x+y*y); }
function radiusKm(){ return state.origin ? RADII.find(r=>r[0]===state.radius)[2] : 1e9; }
const seen = {}; // чтобы при перекручивании варианты не повторялись

// выбирает место: сначала категорию по весам, потом одно из лучших в ней
// opt.maxPc — потолок по тратам, opt.cuisine — список подстрок кухни
function pickPlace(weights, anchor, maxKm, slot, opt){
  opt = opt || {};
  const groups = {};
  for(const p of DATA.places){
    const w = weights[p.k]; if(!w) continue;
    if(hidden.has(pkey(p))) continue;
    if(opt.maxPc!=null && (p.pc==null ? 2 : p.pc) > opt.maxPc) continue;
    if(opt.onlyTop && !p.g) continue;
    if(opt.cuisine && opt.cuisine.length && !(p.c && opt.cuisine.some(c=>p.c.includes(c)))) continue;
    if(anchor && maxKm<1e8 && dist(anchor.la,anchor.lo,p.la,p.lo)>maxKm) continue;
    (groups[p.k]=groups[p.k]||[]).push(p);
  }
  const kinds = Object.keys(groups); if(!kinds.length) return null;
  const sset = seen[slot] = seen[slot] || new Set();
  // убираем уже показанные; если кончились все варианты — начинаем круг заново
  let fresh = {}; kinds.forEach(k=>{ const f=groups[k].filter(p=>!sset.has(p)); if(f.length) fresh[k]=f; });
  if(!Object.keys(fresh).length){ sset.clear(); fresh = groups; }
  const ks = Object.keys(fresh);
  let total = ks.reduce((s,k)=>s+weights[k],0), r = Math.random()*total, kind = ks[0];
  for(const k of ks){ r-=weights[k]; if(r<=0){ kind=k; break; } }
  const list = fresh[kind].slice().sort((a,b)=>b.s-a.s);
  const picked = list.filter(x=>x.g), rest = list.filter(x=>!x.g);
  let p;
  if(picked.length && (!rest.length || Math.random() < .6)){
    const t1 = picked.filter(x=>x.gt===1), pool = t1.length && Math.random()<.4 ? t1 : picked;
    p = pool[Math.floor(Math.random()*pool.length)];
  } else {
    const top = rest.slice(0, Math.max(8, Math.min(60, Math.ceil(rest.length*.35))));
    p = top[Math.floor(Math.random()*top.length)];
  }
  sset.add(p); return p;
}

// ---------- события ----------
const MSK = 3*3600;
function dayWindow(){
  const now = Math.floor(Date.now()/1000);
  const d = new Date((now+MSK)*1000);
  const start = Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())/1000 - MSK; // полночь по Москве
  if(state.day==='today') return [now-1800, start+86400+4*3600, now];
  if(state.day==='tomorrow') return [start+86400, start+2*86400+4*3600, now];
  const wd = d.getUTCDay(); // 0 вс … 6 сб
  if(wd===6) return [now-1800, start+2*86400, now];
  if(wd===0) return [now-1800, start+86400, now];
  const sat = start+(6-wd)*86400; return [sat, sat+2*86400, now];
}
// возвращает подходящий сеанс события [start,end,long] или null
function eventSlot(e, win){
  for(const [s,en] of e.d){
    const long = en-s > 36*3600;
    if(long){ if(s<win[1] && en>Math.max(win[0],win[2])) return [s,en,true]; }
    else if(s>=win[0] && s<win[1]) return [s,en,false];
  }
  return null;
}
function pickEvent(anchor, maxKm){
  if(!DATA.events || !DATA.events.length) return null;
  const win = dayWindow(), mood = EVENT_MOOD[state.mood], ws = wantSets(), cands = [];
  for(const e of DATA.events){
    const sl = eventSlot(e, win); if(!sl) continue;
    if(state.budget==='free' && !e.fr) continue;
    if(state.budget==='low' && !e.fr && e.pf && e.pf>1500) continue;
    if(state.who==='family' && ((e.ag||0)>=16 || e.k.includes('party'))) continue;
    if(state.who!=='family' && !ws.events.has('kids') && e.k.every(k=>k==='kids')) continue;
    if(ws.on && !e.k.some(k=>ws.events.has(k))) continue;
    if(anchor && maxKm<1e8){ if(e.la==null || dist(anchor.la,anchor.lo,e.la,e.lo)>maxKm) continue; }
    let w = e.k.some(k=>mood.includes(k)) ? 3 : (e.k[0]==='other' ? .15 : .3);
    if(ws.on) w = Math.max(w, 1.5);
    if(state.who==='family' && e.k.includes('kids')) w = 3;
    if(sl[2]) w *= .6;                       // длинные выставки чуть реже, чем события «именно сегодня»
    cands.push({e, sl, w});
  }
  if(!cands.length) return null;
  const sset = seen.event = seen.event || new Set();
  let pool = cands.filter(c=>!sset.has(c.e)); if(!pool.length){ sset.clear(); pool = cands; }
  // сначала выбираем тип события по весам, потом случайное событие этого типа:
  // иначе сотни мастер-классов вытесняют редкие концерты и спектакли
  const groups = {};
  pool.forEach(c=>{ const k = c.e.k.find(x=>mood.includes(x)) || c.e.k[0]; const g = groups[k] = groups[k] || {w:0, list:[]}; g.w = Math.max(g.w, c.w); g.list.push(c); });
  const ks = Object.keys(groups);
  let r = Math.random()*ks.reduce((s,k)=>s+groups[k].w,0), kind = ks[0];
  for(const k of ks){ r-=groups[k].w; if(r<=0){ kind=k; break; } }
  const list = groups[kind].list, ch = list[Math.floor(Math.random()*list.length)];
  sset.add(ch.e); return ch;
}

// ссылка на Яндекс Афишу: категория по пожеланиям и настроению, дата по выбранному дню
function afishaCat(){
  const ws = wantSets();
  if(state.who==='family' || ws.events.has('kids')) return ['kids','детские события'];
  if(ws.events.has('show')) return ['standup','стендап'];
  if(ws.events.has('theater')) return ['theatre','спектакли'];
  if(ws.events.has('concert')) return ['concert','концерты'];
  if(ws.events.has('exhibition')) return ['art','выставки'];
  return ({fun:['standup','стендап'], romance:['concert','концерты'], deep:['theatre','спектакли'], cozy:['art','выставки'], adv:['concert','концерты']})[state.mood];
}
function afishaLink(){
  const win = dayWindow(), from = Math.max(win[0], win[2]);
  const d = new Date((from+MSK)*1000), date = d.toISOString().slice(0,10);
  const period = state.day==='weekend' ? Math.max(1, Math.round((win[1]-from)/86400)) : 1;
  const [cat, label] = afishaCat();
  const when = state.day==='today' ? 'на сегодня' : state.day==='tomorrow' ? 'на завтра' : 'на выходные';
  return {url:`https://afisha.yandex.ru/moscow/${cat}?date=${date}&period=${period}`, text:`${label[0].toUpperCase()+label.slice(1)} ${when} на Яндекс Афише ↗`};
}

//  Сборка вечера
// =====================================================================
function fits(item){
  const tags = item[2].split(' '), byDim = {};
  tags.forEach(t=>{const d=TAGS[t]; if(d){(byDim[d]=byDim[d]||[]).push(t);}});
  for(const d in byDim){ if(!byDim[d].includes(state[d])) return 0; }
  if(tags.includes('ACTIVE') && state.energy==='low') return 0;
  if(tags.includes('LAZY') && state.energy==='high' && Math.random()<.6) return 0;
  if(tags.includes('PRICEY') && state.budget!=='high') return 0;
  return byDim.mood ? 2 : 1;
}
function pickIdea(list, avoid){
  let pool = list.map(i=>[i,fits(i)]).filter(x=>x[1]>0);
  const strong = pool.filter(x=>x[1]===2);
  if(strong.length>=2) pool = strong;
  if(!pool.length) pool = list.map(i=>[i,1]);
  let cand = pool.filter(x=>!avoid||x[0][0]!==avoid);
  if(!cand.length) cand = pool;
  const it = cand[Math.floor(Math.random()*cand.length)][0];
  return {type:'idea', t:it[0], n:it[1], q:it[3]||''};
}
const hasData = ()=> !!(DATA && DATA.places && DATA.places.length);
function slots(){
  if(state.place==='home') return [['watch','🎬 Посмотреть'],['food','🍳 Поесть'],['do','🎲 Занятие'],['music','🎧 Фоном играет'],['rule','✦ Правило вечера']];
  const s = [['go','📍 Куда пойти']];
  if(hasData() && DATA.events && DATA.events.length) s.push(['event','🎟 Или событие']);
  s.push(['eat','🍜 Где поесть'],['music','🎧 Плейлист в дорогу'],['rule','✦ Правило вечера']);
  return s;
}
let current = {}, locks = {};
function anchorFor(k){
  // еду ищем рядом с выбранным местом, остальное — рядом с точкой пользователя
  if(k==='eat' && current.go && current.go.type==='place') return current.go.p;
  return state.origin;
}
const NOTHING = 'Под такие условия ничего не нашлось. Попробуйте увеличить бюджет или радиус либо снять часть пожеланий.';
function rollSlot(k){
  const prev = current[k];
  if(k==='go'){
    if(!hasData()){ current.go = pickIdea(DB.go, prev&&prev.t); return; }
    const w = activityWeights(), opt = {maxPc:maxPc()};
    let p = pickPlace(w, state.origin, radiusKm(), 'go', opt), far = false;
    if(!p && state.origin && radiusKm()<1e8){ p = pickPlace(w, null, 1e9, 'go', opt); far = !!p; }
    current.go = p ? {type:'place', p, far} : {type:'none', msg:NOTHING};
  } else if(k==='eat'){
    if(!hasData()){ current.eat = pickIdea(DB.eatout, prev&&prev.t); return; }
    const a = anchorFor('eat'), w = foodWeights();
    const opt = {maxPc: state.budget==='high' ? 3 : (state.budget==='low' && state.onlyTop ? 2 : 1), cuisine: cuisineKeys(), onlyTop: state.onlyTop};
    const steps = a ? (current.go && current.go.type==='place' ? [1.2,2.5,5,1e9] : [radiusKm(),1e9]) : [1e9];
    let p = null;
    for(const km of steps){ p = pickPlace(w, a, km, 'eat', opt); if(p) break; }
    current.eat = p ? {type:'place', p} : {type:'none', msg:NOTHING};
  } else if(k==='event'){
    let c = pickEvent(state.origin, radiusKm());
    if(!c && state.origin && radiusKm()<1e8) c = pickEvent(null, 1e9);
    current.event = c ? {type:'event', e:c.e, sl:c.sl} : {type:'none', msg:'На этот день в афише не нашлось ничего под ваши условия. Попробуйте другой день, бюджет или пожелания.'};
  } else {
    current[k] = pickIdea(DB[k], prev&&prev.t);
  }
}
function generate(){
  const ss = slots().map(s=>s[0]);
  ss.forEach(k=>{ if(!locks[k] || !current[k]) rollSlot(k); });
  render(true);
}

const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https?:\/\//i.test(u||'') ? u : '';
function yandex(p){
  const q = encodeURIComponent(p.n + (p.a ? ', '+p.a : ', Москва'));
  return `https://yandex.ru/maps/?text=${q}&ll=${p.lo}%2C${p.la}&z=17`;
}
function hoursRu(h){
  if(!h) return '';
  if(/^24\/7$/.test(h.trim())) return 'круглосуточно';
  const map = {Mo:'пн',Tu:'вт',We:'ср',Th:'чт',Fr:'пт',Sa:'сб',Su:'вс',PH:'праздники',off:'выходной',closed:'закрыто'};
  let s = h.replace(/\b(Mo|Tu|We|Th|Fr|Sa|Su|PH|off|closed)\b/g, m=>map[m]).replace(/-/g,'–').replace(/;\s*/g,'; ');
  return s.length>70 ? s.slice(0,68)+'…' : s;
}
function kmText(km){ return km<1 ? Math.round(km*100)*10+' м' : km.toFixed(1).replace('.',',')+' км'; }
function fmtWhen(sl){
  const tz = {timeZone:'Europe/Moscow'};
  if(sl[2]) return 'идёт до '+new Date(sl[1]*1000).toLocaleDateString('ru-RU',Object.assign({day:'numeric',month:'long'},tz));
  const d = new Date(sl[0]*1000);
  return d.toLocaleDateString('ru-RU',Object.assign({weekday:'short',day:'numeric',month:'long'},tz))+', '+
         d.toLocaleTimeString('ru-RU',Object.assign({hour:'2-digit',minute:'2-digit'},tz));
}
function placeHtml(k, p, isFar){
  const meta = [];
  if(p.a) meta.push(`<div><span>Адрес:</span> ${esc(p.a)}</div>`);
  if(p.m) meta.push(`<div><span>Метро:</span> ${esc(p.m)}${p.md!=null?' · '+kmText(p.md):''}</div>`);
  if(p.h) meta.push(`<div><span>Часы:</span> ${esc(hoursRu(p.h))}</div>`);
  const chk = avgCheck(p);
  if(chk) meta.push(`<div><span>Средний чек:</span> ${chk} на человека <span title="${p.pl?'По уровню цен из гида Ultima Guide':'Оценка по типу заведения и кухне'}">(${p.pl?'по гиду':'примерно'})</span></div>`);
  if(p.y) meta.push(`<div><span>Данные:</span> сверялись в ${p.y} году</div>`);
  const a = anchorFor(k);
  if(a && a!==p){ const d = dist(a.la,a.lo,p.la,p.lo);
    meta.push(`<div><span>${k==='eat'&&a!==state.origin?'От первого места':'От вас'}:</span> ${kmText(d)}</div>`); }
  const links = [`<a href="${esc(yandex(p))}" target="_blank" rel="noopener">Отзывы на Яндекс Картах ↗</a>`];
  if(safeUrl(p.w)) links.push(`<a class="sec" href="${esc(p.w)}" target="_blank" rel="noopener">Сайт</a>`);
  const far = (k==='go' && isFar) ? '<div class="note" style="margin-top:6px">Рядом ничего подходящего не нашлось, поэтому вариант подальше.</div>' : '';
  const guide = p.g ? `<div class="guide">⭐ ${p.g.map(esc).join(' · ')}</div>` : '';
  return `${guide}<div><span class="tag">${esc(KIND[p.k]||'Место')}</span>${p.c?`<span class="tag">${esc(p.c)}</span>`:''}${p.f?'<span class="tag">вход свободный</span>':(p.pc!=null?`<span class="tag">${PC_LABEL[p.pc]}</span>`:'')}</div>
    <div class="main">${esc(p.n)}</div><div class="note">${esc(TIP[p.k] || '')}</div>${far}
    <div class="meta">${meta.join('')}</div><div class="links">${links.join('')}</div>`;
}
function eventHtml(c){
  const e = c.e, kind = e.k.map(k=>EVENT_KIND[k]).find(Boolean) || 'Событие', meta = [];
  meta.push(`<div><span>Когда:</span> ${esc(fmtWhen(c.sl))}</div>`);
  if(e.p) meta.push(`<div><span>Где:</span> ${esc(e.p)}${e.a?', '+esc(e.a):''}</div>`);
  if(e.m) meta.push(`<div><span>Метро:</span> ${esc(e.m)}</div>`);
  if(e.fr) meta.push('<div><span>Цена:</span> бесплатно</div>'); else if(e.pr) meta.push(`<div><span>Цена:</span> ${esc(e.pr)}</div>`);
  if(state.origin && e.la!=null) meta.push(`<div><span>От вас:</span> ${kmText(dist(state.origin.la,state.origin.lo,e.la,e.lo))}</div>`);
  return `<div><span class="tag">${esc(kind)}</span>${e.ag?`<span class="tag">${e.ag}+</span>`:''}</div>
    <div class="main">${esc(e.t)}</div><div class="meta">${meta.join('')}</div>
    <div class="links">${safeUrl(e.u)?`<a href="${esc(e.u)}" target="_blank" rel="noopener">Подробнее на mos.ru ↗</a>`:''}${afishaBtn()}</div>`;
}
function ideaLinks(k, it){
  const L = (href, text, sec) => `<a${sec?' class="sec"':''} href="${esc(href)}" target="_blank" rel="noopener">${esc(text)}</a>`;
  if(k==='music'){
    const q = encodeURIComponent(it.q || it.t);
    return `<div class="links">${L('https://music.yandex.ru/search?text='+q,'▶ Яндекс Музыка')}${L('https://vk.com/audio?q='+q,'VK Музыка',1)}${L('https://www.youtube.com/results?search_query='+q+'+playlist','YouTube',1)}</div>`;
  }
  if(k==='watch'){
    const name = it.t.replace(/^Сериал\s*/,'').replace(/[«»]/g,'').replace(/\s*\(\d{4}\).*$/,'').replace(/,.*$/,'');
    const q = encodeURIComponent(name);
    return `<div class="links">${L('https://www.kinopoisk.ru/index.php?kp_query='+q,'▶ Найти на Кинопоиске')}</div>`;
  }
  if(k==='food') return `<div class="links">${L('https://eda.yandex.ru/moscow','Лень готовить? Яндекс Еда ↗',1)}</div>`;
  return '';
}
function afishaBtn(){ const a = afishaLink(); return `<a class="sec" href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.text)}</a>`; }
function render(anim){
  const out = document.getElementById('out');
  out.innerHTML = '<div class="grid">'+slots().map(([k,title])=>{
    const it = current[k]; if(!it) return '';
    let body;
    if(it.type==='place') body = placeHtml(k, it.p, it.far);
    else if(it.type==='event') body = eventHtml(it);
    else if(it.type==='none') body = `<div class="note">${esc(it.msg)}</div>${k==='event'?`<div class="links">${afishaBtn()}</div>`:''}`;
    else body = `<div class="main">${esc(it.t)}</div><div class="note">${esc(it.n)}</div>${ideaLinks(k, it)}`;
    return `<div class="card${k==='rule'?' wide':''}${locks[k]?' locked':''}${anim?' fade':''}" data-k="${k}">
      <div class="ctop"><span class="ctitle">${title}</span>
        <span class="btns">
          ${it.type!=='none'?`<button class="ib fav" data-act="fav" aria-pressed="${isFav(itemOf(k))}" title="В избранное" aria-label="В избранное">${isFav(itemOf(k))?'♥':'♡'}</button>`:''}
          ${it.type==='place'?'<button class="ib" data-act="hide" title="Больше не предлагать это место" aria-label="Больше не предлагать это место">🚫</button>':''}
          <button class="ib" data-act="lock" aria-pressed="${!!locks[k]}" title="Закрепить" aria-label="Закрепить">${locks[k]?'🔒':'🔓'}</button>
          <button class="ib" data-act="roll" title="Другой вариант" aria-label="Другой вариант">↻</button>
        </span></div>${body}</div>`;
  }).join('')+'</div>';
  document.getElementById('foot').hidden = false;
  const uh = document.getElementById('unhide'); uh.hidden = !hidden.size; uh.textContent = `Вернуть скрытые места (${hidden.size})`;
}
document.getElementById('out').addEventListener('click',e=>{
  const b = e.target.closest('button'); if(!b) return;
  const k = b.closest('.card').dataset.k;
  if(b.dataset.act==='lock'){ locks[k]=!locks[k]; render(false); return; }
  if(b.dataset.act==='fav'){ toggleFav(itemOf(k)); render(false); return; }
  if(b.dataset.act==='hide'){ const it=current[k]; if(it && it.type==='place'){ hidden.add(pkey(it.p)); saveHidden(); toast('Больше не буду предлагать это место'); } locks[k]=false; }
  rollSlot(k);
  if(k==='go' && !locks.eat && current.eat) rollSlot('eat'); // еда подтягивается к новому месту
  render(false);
  [k].concat(k==='go'?['eat']:[]).forEach(x=>{ const c=document.querySelector(`.card[data-k="${x}"]`); if(c) c.classList.add('fade'); });
});

// ---------- панель параметров ----------
const ctl = document.getElementById('controls');
function drawControls(){
  const out = state.place==='out';
  let h = DIMS.map(d=>`<div class="row${d.out?' outonly':''}"${d.out&&!out?' hidden':''}><span class="label">${d.label}</span><div class="chips">${
    d.opts.map(o=>`<button class="chip" data-d="${d.key}" data-v="${o[0]}" aria-pressed="${state[d.key]===o[0]}">${o[1]}</button>`).join('')
  }</div></div>`).join('');
  const show = out && hasData();
  h += `<div class="row outonly"${show?'':' hidden'}><span class="label">Что хочется</span><div class="chips">
      <button class="chip" data-want="" aria-pressed="${!state.want.length}">Что угодно</button>${
      WANT.map(w=>`<button class="chip" data-want="${w[0]}" aria-pressed="${state.want.includes(w[0])}">${w[1]}</button>`).join('')}</div></div>`;
  h += `<div class="row outonly"${show?'':' hidden'}><span class="label">Кухня</span><div class="chips">${
      CUISINES.map(c=>`<button class="chip" data-d="cuisine" data-v="${c[0]}" aria-pressed="${state.cuisine===c[0]}">${c[1]}</button>`).join('')}</div></div>`;
  h += `<div class="row outonly"${show?'':' hidden'}><span class="label">Еда и бары</span><div class="chips">
      <button class="chip" id="onlytop" aria-pressed="${!!state.onlyTop}">⭐ Только из гидов и премий</button></div></div>`;
  const hasMetro = DATA && DATA.metro && DATA.metro.length;
  h += `<div class="row outonly"${out&&hasData()?'':' hidden'}><span class="label">Рядом с</span><div class="chips">
      ${hasMetro?`<input class="metro" id="metro" list="metrolist" placeholder="станция метро" autocomplete="off" value="${esc(state.origin&&state.origin.metro?state.origin.name:'')}">`:''}
      <button class="chip" id="geo" aria-pressed="${!!(state.origin&&!state.origin.metro)}">📍 Рядом со мной</button>
      ${state.origin?'<button class="chip" id="noorigin">✕ Сбросить</button>':''}
    </div>
    ${state.origin?`<div class="where">Ищу рядом: ${esc(state.origin.name)}</div>`:''}</div>`;
  h += `<div class="row outonly"${out&&hasData()&&state.origin?'':' hidden'}><span class="label">Как далеко</span><div class="chips">${
    RADII.map(r=>`<button class="chip" data-d="radius" data-v="${r[0]}" aria-pressed="${state.radius===r[0]}">${r[1]}</button>`).join('')}</div></div>`;
  ctl.innerHTML = h;
}
function setOrigin(o){ state.origin = o; Object.keys(seen).forEach(k=>delete seen[k]); save(); drawControls(); }
ctl.addEventListener('click',e=>{
  const c = e.target.closest('.chip'); if(!c) return;
  if(c.id==='geo'){
    if(!navigator.geolocation){ toast('Браузер не умеет определять местоположение'); return; }
    toast('Определяю, где вы…');
    navigator.geolocation.getCurrentPosition(
      pos=>{ setOrigin({name:'ваше местоположение', la:pos.coords.latitude, lo:pos.coords.longitude}); toast('Готово, ищу рядом с вами'); },
      ()=>toast('Не получилось определить место. Выберите станцию метро'), {timeout:8000, maximumAge:600000});
    return;
  }
  if(c.id==='noorigin'){ setOrigin(null); return; }
  if(c.id==='onlytop'){ state.onlyTop = !state.onlyTop; save(); drawControls(); return; }
  if(c.dataset.want!=null){
    const v = c.dataset.want;
    if(!v) state.want = []; else state.want = state.want.includes(v) ? state.want.filter(x=>x!==v) : state.want.concat(v);
    save(); drawControls(); return;
  }
  state[c.dataset.d] = c.dataset.v; save(); drawControls();
});
ctl.addEventListener('change',e=>{
  if(e.target.id!=='metro') return;
  const v = e.target.value.trim().toLowerCase().replace(/ё/g,'е');
  if(!v){ setOrigin(null); return; }
  const list = DATA.metro, norm = s=>s.toLowerCase().replace(/ё/g,'е');
  const m = list.find(x=>norm(x[0])===v) || list.find(x=>norm(x[0]).startsWith(v)) || list.find(x=>norm(x[0]).includes(v));
  if(m) setOrigin({name:'м. '+m[0], metro:1, la:m[1], lo:m[2]});
  else toast('Не нашёл такую станцию');
});

document.getElementById('go').onclick = generate;
document.getElementById('reset').onclick = ()=>{ locks={}; render(false); };
document.getElementById('unhide').onclick = ()=>{ hidden.clear(); saveHidden(); render(false); toast('Скрытые места снова в подборе'); };
document.getElementById('copy').onclick = async ()=>{
  const lines = slots().map(([k,t])=>{
    const it = current[k]; if(!it || it.type==='none') return '';
    const head = t.replace(/^\S+\s/,'');
    if(it.type==='place') return `${head}: ${it.p.n}${it.p.a?' ('+it.p.a+')':''}${it.p.m?', м. '+it.p.m:''}\n${yandex(it.p)}`;
    if(it.type==='event') return `${head}: ${it.e.t}. ${fmtWhen(it.sl)}${it.e.p?', '+it.e.p:''}\n${it.e.u}`;
    return `${head}: ${it.t}. ${it.n}`;
  }).filter(Boolean);
  try{ await navigator.clipboard.writeText('План на вечер:\n'+lines.join('\n')); toast('Скопировано, можно отправить в чат'); }
  catch(e){ toast('Не получилось скопировать'); }
};
// =====================================================================
//  Личные данные: избранное, сохранённые вечера, настройки.
//  Всё хранится в браузере (localStorage). Для синхронизации между устройствами
//  достаточно заменить Store.load / Store.save на работу с облаком.
// =====================================================================
const Store = {
  key: 'evening-user-v1',
  data: {favs:[], plans:[]},
  load(){ try{ const d = JSON.parse(localStorage.getItem(this.key)||'null'); if(d) this.data = Object.assign({favs:[],plans:[]}, d); }catch(e){} },
  save(){ try{ localStorage.setItem(this.key, JSON.stringify(this.data)); }catch(e){} updateFavCount(); },
};
Store.load();
const SLOT_NAME = {go:'Куда пойти',event:'Событие',eat:'Где поесть',watch:'Посмотреть',food:'Поесть',do:'Занятие',music:'Музыка',rule:'Правило вечера'};
// превращает карточку в запись для избранного
function itemOf(k){
  const it = current[k]; if(!it) return null;
  if(it.type==='place'){ const p = it.p;
    return {id:'p:'+pkey(p), kind:'place', slot:k, title:p.n, sub:[KIND[p.k], p.a, p.m?'м. '+p.m:''].filter(Boolean).join(' · '), url:yandex(p), p}; }
  if(it.type==='event'){ const e = it.e;
    return {id:'e:'+e.u, kind:'event', slot:k, title:e.t, sub:[fmtWhen(it.sl), e.p].filter(Boolean).join(' · '), url:e.u}; }
  if(it.type==='idea') return {id:'i:'+k+':'+it.t, kind:'idea', slot:k, title:it.t, sub:it.n, q:it.q||''};
  return null;
}
const isFav = x => !!x && Store.data.favs.some(f=>f.id===x.id);
function toggleFav(x){
  if(!x) return;
  if(isFav(x)){ Store.data.favs = Store.data.favs.filter(f=>f.id!==x.id); toast('Убрано из избранного'); }
  else { Store.data.favs.unshift(Object.assign({ts:Date.now()}, x)); toast('Добавлено в избранное ❤️'); }
  Store.save();
}
function updateFavCount(){ const n = Store.data.favs.length + Store.data.plans.length; document.getElementById('favCount').textContent = n ? `(${n})` : ''; }
function planText(){
  return slots().map(([k,t])=>{
    const it = current[k]; if(!it || it.type==='none') return '';
    const head = t.replace(/^\S+\s/,'');
    if(it.type==='place') return `${head}: ${it.p.n}${it.p.a?' ('+it.p.a+')':''}${it.p.m?', м. '+it.p.m:''}`;
    if(it.type==='event') return `${head}: ${it.e.t}. ${fmtWhen(it.sl)}`;
    return `${head}: ${it.t}`;
  }).filter(Boolean).join('\n');
}
document.getElementById('savePlan').onclick = ()=>{
  if(!Object.keys(current).length) return;
  const d = new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
  const mood = DIMS[1].opts.find(o=>o[0]===state.mood)[1], where = state.place==='home' ? 'дома' : 'в городе';
  Store.data.plans.unshift({id:'v:'+Date.now(), ts:Date.now(), title:`${d}: ${mood.toLowerCase()} ${where}`, text:planText(),
    items:slots().map(([k])=>itemOf(k)).filter(Boolean)});
  Store.save(); toast('Вечер сохранён в избранном');
};

// ---------- окно
const modal = document.getElementById('modal');
function openModal(title, html){ document.getElementById('mTitle').textContent = title; document.getElementById('mBody').innerHTML = html; modal.hidden = false; }
function closeModal(){ modal.hidden = true; }
document.getElementById('mClose').onclick = closeModal;
modal.addEventListener('click', e=>{ if(e.target===modal) closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !modal.hidden) closeModal(); });

let favTab = 'places';
function favLink(f){
  if(f.url) return `<a href="${esc(f.url)}" target="_blank" rel="noopener">${f.kind==='event'?'Подробнее ↗':'На карте ↗'}</a>`;
  if(f.slot==='music' && f.q) return `<a href="https://music.yandex.ru/search?text=${encodeURIComponent(f.q)}" target="_blank" rel="noopener">Слушать ↗</a>`;
  return '';
}
function drawFav(){
  const F = Store.data.favs;
  const lists = {places:F.filter(f=>f.kind!=='idea'), ideas:F.filter(f=>f.kind==='idea'), plans:Store.data.plans};
  const tab = (id, label) => `<button class="chip" data-tab="${id}" aria-pressed="${favTab===id}">${label} (${lists[id].length})</button>`;
  let h = `<div class="tabs">${tab('places','Места и события')}${tab('ideas','Идеи')}${tab('plans','Вечера')}</div>`;
  const L = lists[favTab];
  if(!L.length) h += `<p class="muted">Пока пусто. Нажмите ♡ на карточке${favTab==='plans'?' или «💾 Сохранить вечер» под планом':''}, и оно появится здесь.</p>`;
  h += L.map(f=> favTab==='plans'
    ? `<div class="fitem"><div><div class="ft">${esc(f.title)}</div><div class="fs">${esc(f.text)}</div></div><button class="ib" data-del="${esc(f.id)}" aria-label="Удалить">✕</button></div>`
    : `<div class="fitem"><div><div class="ft">${esc(f.title)}</div><div class="fs">${esc(SLOT_NAME[f.slot]||'')}${f.sub?' · '+esc(f.sub):''}</div>${favLink(f)}</div><button class="ib" data-del="${esc(f.id)}" aria-label="Удалить">✕</button></div>`).join('');
  openModal('Избранное', h);
}
document.getElementById('openFav').onclick = drawFav;
document.getElementById('mBody').addEventListener('click', e=>{
  const t = e.target.closest('[data-tab]'); if(t){ favTab = t.dataset.tab; drawFav(); return; }
  const d = e.target.closest('[data-del]');
  if(d){ const id = d.dataset.del; Store.data.favs = Store.data.favs.filter(f=>f.id!==id); Store.data.plans = Store.data.plans.filter(f=>f.id!==id); Store.save(); drawFav(); if(Object.keys(current).length) render(false); return; }
  const a = e.target.closest('[data-set]'); if(a) settingsAction(a.dataset.set);
});

// ---------- настройки
function drawSettings(){
  const hasMetro = DATA && DATA.metro && DATA.metro.length;
  openModal('Настройки', `
    <p class="muted">Выбранные параметры вечера (компания, настроение, бюджет, кухня и так далее) запоминаются сами и сохраняются в этом браузере.</p>
    <h3>Ищу места рядом с</h3>
    <div class="field">${hasMetro?`<input id="setMetro" list="metrolist" placeholder="станция метро" value="${esc(state.origin&&state.origin.metro?state.origin.name.replace(/^м\. /,''):'')}">`:''}
      <button class="chip" data-set="metro">Сохранить</button><button class="chip" data-set="nometro">Вся Москва</button></div>
    <h3>Скрытые места</h3>
    <div class="field"><span class="muted">Убрано из подбора: ${hidden.size}</span>${hidden.size?'<button class="chip" data-set="unhide">Вернуть все</button>':''}</div>
    <h3>Перенос на другое устройство</h3>
    <p class="muted">Скопируйте код и вставьте его на другом телефоне или компьютере. Перенесутся избранное, сохранённые вечера, скрытые места и параметры.</p>
    <div class="field"><button class="chip" data-set="export">📋 Скопировать код</button></div>
    <div class="field"><textarea id="importCode" placeholder="Вставьте код с другого устройства"></textarea></div>
    <div class="field"><button class="chip" data-set="import">Загрузить из кода</button></div>
    <h3>Сброс</h3>
    <div class="field"><button class="chip" data-set="reset">Сбросить параметры вечера</button><button class="chip" data-set="wipe">Удалить все мои данные</button></div>`);
}
document.getElementById('openSet').onclick = drawSettings;
const b64e = s => btoa(unescape(encodeURIComponent(s))), b64d = s => decodeURIComponent(escape(atob(s)));
let wipeArmed = false;
async function settingsAction(a){
  if(a==='metro'){
    const el = document.getElementById('setMetro'); if(!el) return;
    const v = el.value.trim().toLowerCase().replace(/ё/g,'е'), norm = x=>x.toLowerCase().replace(/ё/g,'е');
    const m = DATA.metro.find(x=>norm(x[0])===v) || DATA.metro.find(x=>norm(x[0]).startsWith(v));
    if(m){ setOrigin({name:'м. '+m[0], metro:1, la:m[1], lo:m[2]}); toast('Буду искать рядом с м. '+m[0]); drawSettings(); } else toast('Не нашёл такую станцию');
  } else if(a==='nometro'){ setOrigin(null); toast('Ищу по всей Москве'); drawSettings(); }
  else if(a==='unhide'){ hidden.clear(); saveHidden(); toast('Скрытые места снова в подборе'); drawSettings(); }
  else if(a==='export'){
    const code = b64e(JSON.stringify({v:1, user:Store.data, hidden:[...hidden], state}));
    try{ await navigator.clipboard.writeText(code); toast('Код скопирован'); }
    catch(e){ document.getElementById('importCode').value = code; toast('Скопируйте код из поля ниже'); }
  } else if(a==='import'){
    try{
      const d = JSON.parse(b64d(document.getElementById('importCode').value.trim()));
      if(!d || d.v!==1) throw 0;
      const ids = new Set(Store.data.favs.map(f=>f.id)), pids = new Set(Store.data.plans.map(f=>f.id));
      Store.data.favs = Store.data.favs.concat((d.user.favs||[]).filter(f=>!ids.has(f.id)));
      Store.data.plans = Store.data.plans.concat((d.user.plans||[]).filter(f=>!pids.has(f.id)));
      Store.save(); (d.hidden||[]).forEach(x=>hidden.add(x)); saveHidden();
      Object.assign(state, d.state||{}); save(); drawControls();
      toast('Данные загружены'); drawSettings();
    }catch(e){ toast('Код не подошёл. Скопируйте его целиком'); }
  } else if(a==='reset'){
    Object.assign(state, {who:'duo',mood:'cozy',energy:'mid',budget:'low',place:'out',day:'today',radius:'any',origin:null,want:[],cuisine:'any',onlyTop:false});
    save(); drawControls(); toast('Параметры сброшены'); drawSettings();
  } else if(a==='wipe'){
    if(!wipeArmed){ wipeArmed = true; toast('Нажмите ещё раз, чтобы удалить избранное, вечера и скрытые места'); setTimeout(()=>wipeArmed=false, 4000); return; }
    wipeArmed = false; Store.data = {favs:[], plans:[]}; Store.save(); hidden.clear(); saveHidden();
    toast('Все данные удалены'); drawSettings(); if(Object.keys(current).length) render(false);
  }
}
updateFavCount();

let toastTimer;
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2200); }

// ---------- загрузка базы ----------
function credits(){
  let h = '';
  if(hasData()){
    const d = new Date(DATA.updated);
    const when = isNaN(d) ? '' : d.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});
    h += `Мест в базе: ${DATA.places.length.toLocaleString("ru-RU")} · событий: ${(DATA.events||[]).length.toLocaleString("ru-RU")}${when?' · обновлено '+when:''}<br>`;
  }
  h += 'Места: © участники <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> (ODbL) · события: <a href="https://www.mos.ru/afisha/" target="_blank" rel="noopener">афиша mos.ru</a><br>Значком ⭐ отмечены места из гидов Ultima Guide, премии WhereToEat и подборок «Афиши Daily». У остальных оценок нет, а часть могла закрыться. Перед выходом проверьте место по ссылке на карты. Кнопка 🚫 убирает место из подбора.';
  document.getElementById('credits').innerHTML = h;
}
function banner(){
  const b = document.getElementById('banner');
  if(!hasData()) b.innerHTML = '<div class="banner">База мест пока не загрузилась, поэтому для города показываю общие идеи. Режим «Дома» работает полностью.</div>';
  else if(DATA.demo) b.innerHTML = '<div class="banner">Сейчас в базе демо-набор из нескольких десятков известных мест. Полная база Москвы появится после первого автоматического обновления.</div>';
  else b.innerHTML = '';
}
function init(){
  if(DATA && DATA.metro) document.getElementById('metrolist').innerHTML = DATA.metro.map(m=>`<option value="${esc(m[0])}">`).join('');
  if(state.origin && state.origin.metro && !(DATA && DATA.metro && DATA.metro.length)) state.origin = null;
  drawControls(); banner(); credits();
}
init();
fetch('data/places.json', {cache:'no-cache'})
  .then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(d=>{ if(d && Array.isArray(d.places)){ DATA = d; init(); } })
  .catch(()=>{});
</script>
</body>
</html>
