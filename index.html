<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вечер в Москве</title>
<meta name="description" content="Собирает план на вечер из реальных мест и событий Москвы.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#0d0b22">
<script>
  (function(){ var t='system'; try{ t=localStorage.getItem('evening-theme')||'system'; }catch(e){}
    if(['system','light','dark'].indexOf(t)<0) t='system'; document.documentElement.setAttribute('data-theme', t); })();
</script>
<style>
/* Вечер в Москве. Прозрачное стекло поверх огней города; темы: системная, светлая, тёмная (data-theme на <html>). */
:root{ --base1:#22103f; --base2:#0b0b22;
  --l1:rgba(255,45,85,.6); --l2:rgba(255,140,60,.4); --l3:rgba(205,55,200,.4); --l4:rgba(70,95,255,.42);
  --accent:#ff375f; --accent-soft:rgba(255,55,95,.2); --on-accent:#fff;
  --text:#fff; --muted:rgba(255,255,255,.66); --faint:rgba(255,255,255,.42);
  --nav:rgba(255,255,255,0); --glass:rgba(255,255,255,.055); --glass-2:rgba(255,255,255,.11); --edge:rgba(255,255,255,.22); --edge-lo:rgba(255,255,255,.08); --sheen:.14;
  --seg-bg:rgba(255,255,255,.08); --thumb:rgba(255,255,255,.24); --thumb-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 3px 12px rgba(0,0,0,.25);
  --shadow:0 16px 44px rgba(5,4,25,.32); --scrim:rgba(8,6,25,.35); --solid:rgba(30,20,55,.94); --shade:#06040f; --shade-a:.62;
  color-scheme:dark;
  --r-xl:30px; --r-l:24px; --r-m:18px;
  --spring:cubic-bezier(.34,1.45,.55,1); --ease:cubic-bezier(.2,.8,.2,1); }
:root[data-theme="light"]{ --base1:#fff4f6; --base2:#f4eefc;
  --l1:rgba(255,59,95,.36); --l2:rgba(255,159,90,.4); --l3:rgba(222,110,230,.3); --l4:rgba(110,140,255,.3);
  --accent:#f0244f; --accent-soft:rgba(240,36,79,.12); --on-accent:#fff;
  --text:#1c1022; --muted:rgba(28,16,34,.6); --faint:rgba(28,16,34,.4);
  --nav:rgba(255,255,255,.04); --glass:rgba(255,255,255,.3); --glass-2:rgba(255,255,255,.55); --edge:rgba(255,255,255,.9); --edge-lo:rgba(60,20,60,.07); --sheen:.5;
  --seg-bg:rgba(60,20,60,.06); --thumb:#fff; --thumb-shadow:0 2px 8px rgba(80,20,60,.14);
  --shadow:0 14px 40px rgba(120,40,90,.1); --scrim:rgba(60,20,50,.15); --solid:rgba(255,255,255,.95); --shade:#fbf3f8; --shade-a:.55;
  color-scheme:light; }
@media (prefers-color-scheme: light){ :root[data-theme="system"]{ --base1:#fff4f6; --base2:#f4eefc;
  --l1:rgba(255,59,95,.36); --l2:rgba(255,159,90,.4); --l3:rgba(222,110,230,.3); --l4:rgba(110,140,255,.3);
  --accent:#f0244f; --accent-soft:rgba(240,36,79,.12); --on-accent:#fff;
  --text:#1c1022; --muted:rgba(28,16,34,.6); --faint:rgba(28,16,34,.4);
  --nav:rgba(255,255,255,.04); --glass:rgba(255,255,255,.3); --glass-2:rgba(255,255,255,.55); --edge:rgba(255,255,255,.9); --edge-lo:rgba(60,20,60,.07); --sheen:.5;
  --seg-bg:rgba(60,20,60,.06); --thumb:#fff; --thumb-shadow:0 2px 8px rgba(80,20,60,.14);
  --shadow:0 14px 40px rgba(120,40,90,.1); --scrim:rgba(60,20,50,.15); --solid:rgba(255,255,255,.95); --shade:#fbf3f8; --shade-a:.55;
  color-scheme:light; } }
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body.locked{position:fixed;left:0;right:0;overflow:hidden}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:-apple-system,BlinkMacSystemFont,"Onest",system-ui,sans-serif;color:var(--text);background:var(--base2);min-height:100vh;
  line-height:1.5;font-size:16px;-webkit-font-smoothing:antialiased;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}
.lights{position:fixed;inset:-12vmax;z-index:-1;pointer-events:none;background:
   radial-gradient(34vmax 28vmax at 14% 16%, var(--l1), transparent 64%),
   radial-gradient(30vmax 26vmax at 86% 12%, var(--l2), transparent 62%),
   radial-gradient(40vmax 32vmax at 80% 82%, var(--l3), transparent 64%),
   radial-gradient(34vmax 30vmax at 16% 86%, var(--l4), transparent 62%),
   linear-gradient(165deg, var(--base1), var(--base2) 75%);
  animation:drift 40s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(-2vmax,1.5vmax,0) scale(1.04)}}
/* стекло: почти прозрачное, с кромкой и бликом */
.glass{position:relative;background:var(--glass);border-radius:var(--r-l);
  -webkit-backdrop-filter:blur(18px) saturate(170%);backdrop-filter:blur(18px) saturate(170%);
  box-shadow:inset 0 1px 0 var(--edge), inset 0 0 0 1px var(--edge-lo), var(--shadow)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(140deg, rgba(255,255,255,var(--sheen)), rgba(255,255,255,0) 36%, rgba(255,255,255,0) 74%, rgba(255,255,255,calc(var(--sheen)*.4)))}
.wrap{max-width:1080px;margin:0 auto;padding:16px 18px 60px}
/* нажатия: пружина, как в iOS */
.tap{transition:transform .35s var(--spring), background-color .2s, color .2s, box-shadow .25s}
.tap:active{transform:scale(.94);transition-duration:.12s}
/* ---------- верхняя панель */
.topnav{background:var(--nav)!important;-webkit-backdrop-filter:blur(5px) saturate(140%)!important;backdrop-filter:blur(5px) saturate(140%)!important;box-shadow:inset 0 0 0 1px var(--edge-lo)!important;position:sticky;top:10px;z-index:6;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 6px 6px 16px;border-radius:999px;margin-bottom:28px}
.topnav::before{display:none}
.brand{display:flex;align-items:center;gap:9px;font-weight:650;letter-spacing:-.02em;font-size:16px;border:0;background:none;cursor:pointer}
.brand i{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-soft), 0 0 16px var(--accent)}
.navbtns{display:flex;gap:2px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:7px;border:0;cursor:pointer;font-size:15px;background:transparent;padding:9px 13px;border-radius:999px}
.pill:hover{background:var(--glass-2)}
.pill svg{width:18px;height:18px;flex:none}
.count{font-variant-numeric:tabular-nums;color:var(--accent);font-weight:650}
.count:empty{display:none}
/* ---------- переключатель со скользящим «бегунком» */
.seg{position:relative;display:inline-flex;padding:3px;border-radius:999px;background:var(--seg-bg);isolation:isolate}
.seg>button{position:relative;z-index:1;border:0;background:transparent;cursor:pointer;color:var(--muted);border-radius:999px;transition:color .25s}
.seg>button[aria-pressed="true"]{color:var(--text)}
.seg>.thumb{position:absolute;z-index:0;top:3px;bottom:3px;left:0;width:0;border-radius:999px;background:var(--thumb);box-shadow:var(--thumb-shadow);
  transform:translateX(var(--x,0));width:var(--w,0);transition:transform .45s var(--spring), width .45s var(--spring)}
.seg.ready>.thumb{opacity:1}
.theme>button{width:32px;height:32px;display:grid;place-items:center}
.theme>button svg{width:16px;height:16px}
.seg.text>button{padding:8px 14px;font-size:14px;white-space:nowrap}
/* ---------- опрос */
.quiz{max-width:760px;margin:6vh auto 0}
.progress{display:flex;gap:5px;margin:0 4px 26px}
.progress i{flex:1;height:4px;border-radius:4px;background:var(--seg-bg);overflow:hidden;position:relative}
.progress i::after{content:"";position:absolute;inset:0;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .5s var(--ease)}
.progress i.done::after{transform:scaleX(1)}
.qhead{display:flex;align-items:center;gap:10px;margin:0 4px 6px;min-height:36px}
.back{display:inline-flex;align-items:center;gap:4px;border:0;background:var(--glass);cursor:pointer;padding:7px 12px 7px 8px;border-radius:999px;font-size:15px;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 0 0 1px var(--edge-lo)}
.back svg{width:18px;height:18px}
.stepno{color:var(--muted);font-size:14px;margin-left:auto}
.stage{position:relative}
.step{will-change:transform,opacity}
.step.in-fwd{animation:inF .45s var(--ease) both}.step.in-back{animation:inB .45s var(--ease) both}
@keyframes inF{from{opacity:0;transform:translateX(42px)}to{opacity:1;transform:none}}
@keyframes inB{from{opacity:0;transform:translateX(-42px)}to{opacity:1;transform:none}}
.q{font-weight:680;font-size:clamp(32px,5.4vw,54px);line-height:1.02;letter-spacing:-.045em;margin:6px 4px 10px;max-width:16ch}
.qsub{color:var(--muted);margin:0 4px 24px;font-size:17px;max-width:52ch}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.opt{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:14px;text-align:left;border:0;cursor:pointer;padding:18px 18px 16px;border-radius:var(--r-l);min-height:118px}
.opt .oi{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);transition:background .3s,color .3s}
.opt .oi svg{width:22px;height:22px}
.opt b{font-weight:620;font-size:18px;letter-spacing:-.015em;line-height:1.2}
.opt small{display:block;color:var(--muted);font-size:14px;font-weight:400;margin-top:2px}
.opt:hover{background:var(--glass-2)}
.opt[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);box-shadow:0 14px 34px var(--accent-soft), inset 0 1px 0 rgba(255,255,255,.4)}
.opt[aria-pressed="true"] small{color:rgba(255,255,255,.8)}
.opt[aria-pressed="true"] .oi{background:rgba(255,255,255,.22);color:#fff}
.check{position:absolute;top:14px;right:14px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--accent);
  transform:scale(0);transition:transform .4s var(--spring)}
.check svg{width:15px;height:15px;stroke-width:2.6;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .35s .12s var(--ease)}
.opt[aria-pressed="true"] .check{transform:scale(1)}
.opt[aria-pressed="true"] .check svg{stroke-dashoffset:0}
.opts.small{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.opts.small .opt{min-height:0;flex-direction:row;align-items:center;gap:12px;padding:14px 16px}
.opts.small .opt .oi{width:34px;height:34px;border-radius:11px}
.opts.small .opt b{font-size:16px}
.qfoot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:22px}
.step .opts.small~.qfoot,.step .chipset~.qfoot{position:sticky;bottom:14px;z-index:2}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:0;cursor:pointer;font-size:17px;font-weight:650;color:var(--on-accent);
  padding:15px 26px;border-radius:999px;background:var(--accent);box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 12px 30px var(--accent-soft)}
.cta svg{width:19px;height:19px}
.cta:hover{filter:brightness(1.06)}
.soft{display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;font-size:15px;padding:12px 18px;border-radius:999px;background:var(--glass);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 0 0 1px var(--edge-lo)}
.soft svg{width:17px;height:17px;color:var(--accent)}
.soft:hover{background:var(--glass-2)}
.again{margin:0 4px 18px}
.field{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.input{flex:1;min-width:200px;border:0;background:var(--glass);box-shadow:inset 0 0 0 1px var(--edge);color:var(--text);padding:14px 18px;border-radius:16px;font:inherit;font-size:17px;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.input::placeholder{color:var(--faint)}
.chipset{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:0;cursor:pointer;padding:9px 15px;border-radius:999px;font-size:15px;background:var(--glass);box-shadow:inset 0 0 0 1px var(--edge-lo);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.chip:hover{background:var(--glass-2)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--on-accent);box-shadow:0 6px 18px var(--accent-soft)}
.chip svg{width:15px;height:15px;vertical-align:-2px;margin-right:6px}
.lbl2{color:var(--muted);font-size:15px;margin:20px 4px 10px}
/* ---------- результаты */
.rhead{margin:4px 4px 16px}
.rhead h1{font-weight:680;font-size:clamp(34px,5.6vw,60px);line-height:1;letter-spacing:-.045em}
.answers{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 0}
.answers button{border:0;cursor:pointer;font-size:14px;padding:7px 12px;border-radius:999px;background:var(--glass);box-shadow:inset 0 0 0 1px var(--edge-lo);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.answers button:hover{background:var(--glass-2)}
.answers button span{color:var(--muted)}
.plan{padding:20px 22px;border-radius:var(--r-xl);margin:18px 0 30px}
.plan h2{font-size:15px;font-weight:600;color:var(--muted);margin-bottom:10px}
.plist{display:grid;gap:2px;counter-reset:p}
.pline{display:flex;gap:12px;align-items:baseline;padding:7px 0;border-top:1px solid var(--edge-lo);animation:fadein .4s var(--ease)}
.pline:first-child{border-top:0}
.pline em{font-style:normal;color:var(--muted);font-size:14px;min-width:120px}
.pline b{font-weight:600}
.pacts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.sec{margin:0 0 30px}
.sechead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 4px 12px}
.sechead h2{display:flex;align-items:center;gap:9px;font-size:22px;font-weight:660;letter-spacing:-.025em}
.sechead h2 svg{width:21px;height:21px;color:var(--accent)}
.sechead small{color:var(--muted);font-size:14px;font-weight:400;margin-left:2px}
.lane{--bleed:calc((100vw - min(100vw, 1080px)) / 2 + 18px);display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;
  margin:-14px calc(-1 * var(--bleed)) -30px;padding:20px var(--bleed) 44px;scroll-padding:0 var(--bleed);scrollbar-width:none;overscroll-behavior-x:contain}
/* эффект дальности: карточки у края уменьшаются и уходят в тень */
.lane>*{scale:calc(1 - var(--d,0) * .12);will-change:scale}
.lane>.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:var(--shade);opacity:calc(var(--d,0) * var(--shade-a))}
.lane::-webkit-scrollbar{display:none}
.card{flex:0 0 300px;scroll-snap-align:start;display:flex;flex-direction:column;padding:18px;border-radius:var(--r-l);min-height:250px;cursor:pointer;
  transition:transform .35s var(--spring), box-shadow .3s}
.card.pop{animation:pop .5s var(--spring) both}
.card.pop:nth-child(2){animation-delay:.04s}.card.pop:nth-child(3){animation-delay:.08s}.card.pop:nth-child(4){animation-delay:.12s}
.card.pop:nth-child(5){animation-delay:.16s}.card.pop:nth-child(6){animation-delay:.2s}.card.pop:nth-child(7){animation-delay:.24s}.card.pop:nth-child(8){animation-delay:.28s}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.card.sel{box-shadow:inset 0 0 0 2px var(--accent), 0 16px 40px var(--accent-soft)}
.card.gone{animation:gone .35s var(--ease) forwards}
@keyframes gone{to{opacity:0;transform:scale(.9);flex-basis:0;padding:0;margin-right:-12px}}
.ctop{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px;min-height:32px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--on-accent);background:var(--accent);padding:4px 10px 4px 7px;border-radius:999px;
  transform:scale(0);transform-origin:left center;transition:transform .4s var(--spring)}
.badge svg{width:14px;height:14px;stroke-width:2.6}
.card.sel .badge{transform:scale(1)}
.kind{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.kind svg{width:15px;height:15px;color:var(--accent)}
.card.sel .kind{display:none}
.tools{display:inline-flex;gap:2px}
.ib{width:32px;height:32px;border-radius:50%;border:0;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center}
.ib svg{width:18px;height:18px}
.ib:hover{background:var(--glass-2);color:var(--text)}
.ib.fav[aria-pressed="true"]{color:var(--accent)}
.ib.fav[aria-pressed="true"] svg{animation:heart .5s var(--spring)}
@keyframes heart{0%{transform:scale(.6)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.name{font-weight:650;font-size:20px;line-height:1.2;letter-spacing:-.02em;margin-bottom:6px;overflow-wrap:anywhere}
.guide{display:flex;align-items:flex-start;gap:6px;font-size:13px;line-height:1.35;color:var(--accent);margin-bottom:8px;font-weight:550}
.guide svg{width:14px;height:14px;flex:none;margin-top:1px}
.note{color:var(--muted);font-size:14px}
.meta{font-size:14px;margin-top:10px;display:grid;gap:3px}
.meta span{color:var(--muted)}
.meta .rub{color:var(--text);font-weight:650;letter-spacing:.04em}.meta .rub-off{color:var(--faint);letter-spacing:.04em;margin-right:6px}
.links{margin-top:auto;padding-top:14px;display:flex;flex-wrap:wrap;gap:6px}
.links a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-size:14px;font-weight:550;padding:8px 13px;border-radius:999px;color:var(--text);
  background:var(--glass-2);box-shadow:inset 0 0 0 1px var(--edge-lo)}
.links a.main{background:var(--accent-soft);color:var(--accent);box-shadow:none;font-weight:620}
.links a:hover{filter:brightness(1.08)}
.links a svg{width:15px;height:15px}
.more{flex:0 0 150px;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border:0;cursor:pointer;border-radius:var(--r-l);
  color:var(--accent);font-weight:600;font-size:15px;background:var(--glass);box-shadow:inset 0 0 0 1px var(--edge-lo);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.more span{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft)}
.more svg{width:22px;height:22px}
.small-cards .card{flex-basis:250px;min-height:170px}
.wide-card{padding:20px 22px;border-radius:var(--r-l);display:flex;align-items:center;justify-content:space-between;gap:16px}
.wide-card .name{font-size:22px;margin:0}
.empty{color:var(--muted);padding:6px 4px 10px}
.credits{margin-top:50px;color:var(--faint);font-size:13px;line-height:1.7;max-width:70ch}
.credits a{color:var(--muted)}
.banner{padding:14px 18px;margin-bottom:14px;font-size:15px;border-radius:var(--r-m)}
.view-in{animation:inF .5s var(--ease) both}
/* ---------- окно */
.modal{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;position:fixed;inset:0;z-index:10;display:flex;align-items:flex-start;justify-content:center;padding:6vh 14px;overflow:auto;
  background:var(--scrim);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);animation:fadein .25s}
.sheet{width:100%;max-width:640px;padding:24px;border-radius:var(--r-xl);background:var(--glass-2);animation:sheet .45s var(--spring)}
@keyframes sheet{from{opacity:0;transform:translateY(30px) scale(.97)}to{opacity:1;transform:none}}
.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sheet h2{font-weight:660;font-size:28px;letter-spacing:-.03em}
.sheet h3{font-size:17px;font-weight:650;margin:22px 0 8px}
.sheet .ib{background:var(--glass)}
.fitem{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:12px 0;border-top:1px solid var(--edge-lo)}
.fitem .ft{font-weight:600}.fitem .fs{color:var(--muted);font-size:14px;white-space:pre-line}
.fitem a{color:var(--accent);font-size:14px}
.sheet .field input,.sheet .field textarea{background:var(--glass);border:0;box-shadow:inset 0 0 0 1px var(--edge-lo);color:var(--text);border-radius:12px;padding:10px 13px;font:inherit;font-size:15px}
.sheet .field input{flex:1;min-width:180px}
.sheet .field textarea{width:100%;min-height:72px;font-size:12px}
.chip.primary{background:var(--accent);color:var(--on-accent);box-shadow:none;font-weight:600}
.muted{color:var(--muted);font-size:15px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px) scale(.96);padding:11px 18px;border-radius:999px;font-weight:600;font-size:15px;
  background:var(--glass-2);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  box-shadow:inset 0 1px 0 var(--edge), var(--shadow);opacity:0;transition:opacity .25s, transform .45s var(--spring);pointer-events:none;z-index:20;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){ .glass,.sheet,.toast{background:var(--solid)} }
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none!important;transition:none!important} }
@media (max-width:600px){
  .wrap{padding:10px 12px 48px}
  .lane{--bleed:12px}
  .pill .lbl,.brand span{display:none}
  .pill{padding:9px 10px}
  .quiz{margin-top:2vh}
  .opts{grid-template-columns:1fr 1fr;gap:10px}
  .opt{min-height:104px;padding:14px}
  .opt b{font-size:16px}
  .opts.small{grid-template-columns:1fr}
  .card{flex-basis:84vw}
  .small-cards .card{flex-basis:72vw}
  .pline{flex-direction:column;gap:0}
  .sechead small{display:none}
  .pacts .soft{padding:10px 14px;font-size:14px}
  .wide-card{flex-direction:column;align-items:flex-start}
}

.seg>.chip{background:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.seg>.chip[aria-pressed="true"]{background:transparent;color:var(--text);box-shadow:none}

function wantSets(){
  const places = new Set(), events = new Set();
  WANT.filter(w=>state.want.includes(w[0])).forEach(w=>{ w[2].forEach(x=>places.add(x)); w[3].forEach(x=>events.add(x)); });
  return {places, events, on: state.want.length>0};
}
function activityWeights(){
  const mood = MOOD_W[state.mood], ws = wantSets();
  let w = {};
  if(ws.on){ ws.places.forEach(k=>{ w[k] = 1 + (mood[k]||0); }); }       // явные пожелания важнее настроения
  else {
    w = Object.assign({}, mood);
    if(state.budget==='free') Object.keys(FREEISH).forEach(k=>{ w[k] = (w[k]||0) + FREEISH[k]; });
    if(state.who==='family') Object.assign(w,{zoo:2,planetarium:2,museum:2}, state.energy!=='low'?{trampoline:2}:{});
    if(state.who==='solo') ['quest','bowling','karaoke'].forEach(k=>{ if(w[k]) w[k]*=.3; });
    if(state.energy==='low') ACTIVE.forEach(k=>delete w[k]);
    if(state.energy==='high') ACTIVE.forEach(k=>{ if(w[k]) w[k]*=2; });
  }
  if(state.who==='family') ['club','karaoke','comedy','banya'].forEach(k=>delete w[k]);

function foodWeights(){

  return w;
}

function dist(a,b,c,d){ const p=Math.PI/180, x=(d-b)*p*Math.cos((a+c)/2*p), y=(c-a)*p; return 6371*Math.sqrt(x*x+y*y); }
function radiusKm(){ return state.origin ? RADII.find(r=>r[0]===state.radius)[2] : 1e9; }
const seen = {}; // чтобы при перекручивании варианты не повторялись

const KIDS_EV = /дошкол|малыш|для детей|детск|школьник|юных|юного|родител/i;
const KIDS_RE = /детск|для детей|юношеск|школ|кукольн|юного|малыш/i;
// выбирает место: сначала категорию по весам, потом одно из подходящих в ней.
// opt.maxPc — потолок по тратам, opt.cuisine — подстроки кухни, opt.exclude — что точно не показывать
function pickPlace(weights, anchor, maxKm, slot, opt){
  opt = opt || {};
  const groups = {};
  for(const p of DATA.places){
    const w = weights[p.k]; if(!w) continue;
    const key = pkey(p);
    if(hidden.has(key) || key===opt.exclude) continue;
    if(opt.maxPc!=null && (p.pc==null ? 2 : p.pc) > opt.maxPc) continue;
    if(opt.onlyTop && !p.g) continue;
    if(state.who!=='family' && KIDS_RE.test(p.n)) continue;
    if(opt.cuisine && opt.cuisine.length && !(p.c && opt.cuisine.some(c=>p.c.includes(c)))) continue;
    if(anchor && maxKm<1e8 && dist(anchor.la,anchor.lo,p.la,p.lo)>maxKm) continue;
    (groups[p.k]=groups[p.k]||[]).push(p);
  }
  if(!Object.keys(groups).length) return null;
  if(opt.minPool && Object.values(groups).reduce((n,l)=>n+l.length,0) < opt.minPool) return null;
  const sset = seen[slot] = seen[slot] || new Set();
  // сначала то, что ещё не показывали ни сейчас, ни в прошлые визиты; потом то, что не показывали сейчас
  const pass = f => { const o = {}; for(const k in groups){ const l = groups[k].filter(f); if(l.length) o[k] = l; } return o; };
  let fresh = pass(p=>!sset.has(p) && !recentSet.has(pkey(p)));
  if(!Object.keys(fresh).length) fresh = pass(p=>!sset.has(p));
  if(!Object.keys(fresh).length){ sset.clear(); fresh = groups; }
  const ks = Object.keys(fresh);
  let total = ks.reduce((s,k)=>s+weights[k],0), r = Math.random()*total, kind = ks[0];
  for(const k of ks){ r-=weights[k]; if(r<=0){ kind=k; break; } }
  const list = fresh[kind].slice().sort((a,b)=>b.s-a.s);
  const picked = list.filter(x=>x.g), rest = list.filter(x=>!x.g);
  let p;
  if(picked.length && (!rest.length || Math.random() < .6)){
    const t1 = picked.filter(x=>x.gt===1), pool = t1.length && Math.random()<.25 ? t1 : picked;
    p = pool[Math.floor(Math.random()*pool.length)];
  } else {
    const top = rest.slice(0, Math.max(10, Math.min(150, Math.ceil(rest.length*.4))));
    p = top[Math.floor(Math.random()*top.length)];
  }
  sset.add(p); remember(p); return p;
}

const MSK = 3*3600;
function dayWindow(){
  const now = Math.floor(Date.now()/1000);
  const d = new Date((now+MSK)*1000);
  const start = Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())/1000 - MSK; // полночь по Москве
  if(state.day==='today') return [now-1800, start+86400+4*3600, now];
  if(state.day==='tomorrow') return [start+86400, start+2*86400+4*3600, now];
  const wd = d.getUTCDay(); // 0 вс … 6 сб
  if(wd===6) return [now-1800, start+2*86400, now];
  if(wd===0) return [now-1800, start+86400, now];
  const sat = start+(6-wd)*86400; return [sat, sat+2*86400, now];
}
// возвращает подходящий сеанс события [start,end,long] или null
function eventSlot(e, win){
  for(const [s,en] of e.d){
    const long = en-s > 36*3600;
    if(long){ if(s<win[1] && en>Math.max(win[0],win[2])) return [s,en,true]; }
    else if(s>=win[0] && s<win[1]) return [s,en,false];
  }
  return null;
}
function pickEvent(anchor, maxKm){
  if(!DATA.events || !DATA.events.length) return null;
  const win = dayWindow(), mood = EVENT_MOOD[state.mood], ws = wantSets(), cands = [];
  for(const e of DATA.events){
    const sl = eventSlot(e, win); if(!sl) continue;
    if(state.budget==='free' && !e.fr) continue;
    if(state.budget==='low' && !e.fr && e.pf && e.pf>1500) continue;
    if(state.who==='family' && ((e.ag||0)>=16 || e.k.includes('party'))) continue;
    if(state.who!=='family' && !ws.events.has('kids') && (e.k.every(k=>k==='kids') || KIDS_EV.test(e.t))) continue;
    if(ws.on && !e.k.some(k=>ws.events.has(k))) continue;
    if(anchor && maxKm<1e8){ if(e.la==null || dist(anchor.la,anchor.lo,e.la,e.lo)>maxKm) continue; }
    let w = e.k.some(k=>mood.includes(k)) ? 3 : (e.k[0]==='other' ? .15 : .3);
    if(ws.on) w = Math.max(w, 1.5);
    if(state.who==='family' && e.k.includes('kids')) w = 3;
    if(sl[2]) w *= .6;                       // длинные выставки чуть реже, чем события «именно сегодня»
    cands.push({e, sl, w});
  }
  if(!cands.length) return null;
  const sset = seen.event = seen.event || new Set();
  let pool = cands.filter(c=>!sset.has(c.e)); if(!pool.length){ sset.clear(); pool = cands; }
  // сначала выбираем тип события по весам, потом случайное событие этого типа:
  // иначе сотни мастер-классов вытесняют редкие концерты и спектакли
  const groups = {};
  pool.forEach(c=>{ const k = c.e.k.find(x=>mood.includes(x)) || c.e.k[0]; const g = groups[k] = groups[k] || {w:0, list:[]}; g.w = Math.max(g.w, c.w); g.list.push(c); });
  const ks = Object.keys(groups);
  let r = Math.random()*ks.reduce((s,k)=>s+groups[k].w,0), kind = ks[0];
  for(const k of ks){ r-=groups[k].w; if(r<=0){ kind=k; break; } }
  const list = groups[kind].list, ch = list[Math.floor(Math.random()*list.length)];
  sset.add(ch.e); return ch;
}

function fits(item){
  const tags = item[2].split(' '), byDim = {};
  tags.forEach(t=>{const d=TAGS[t]; if(d){(byDim[d]=byDim[d]||[]).push(t);}});
  for(const d in byDim){ if(!byDim[d].includes(state[d])) return 0; }
  if(tags.includes('ACTIVE') && state.energy==='low') return 0;
  if(tags.includes('LAZY') && state.energy==='high' && Math.random()<.6) return 0;
  if(tags.includes('PRICEY') && state.budget!=='high') return 0;
  return byDim.mood ? 2 : 1;
}
function pickIdea(list, avoid){
  let pool = list.map(i=>[i,fits(i)]).filter(x=>x[1]>0);
  const strong = pool.filter(x=>x[1]===2);
  if(strong.length>=2) pool = strong;
  if(!pool.length) pool = list.map(i=>[i,1]);
  let cand = pool.filter(x=>!avoid||x[0][0]!==avoid);
  if(!cand.length) cand = pool;
  const it = cand[Math.floor(Math.random()*cand.length)][0];
  return {type:'idea', t:it[0], n:it[1], q:it[3]||''};
}

}
function hoursRu(h){
  if(!h) return '';
  if(/^24\/7$/.test(h.trim())) return 'круглосуточно';
  const map = {Mo:'пн',Tu:'вт',We:'ср',Th:'чт',Fr:'пт',Sa:'сб',Su:'вс',PH:'праздники',off:'выходной',closed:'закрыто'};
  let s = h.replace(/\b(Mo|Tu|We|Th|Fr|Sa|Su|PH|off|closed)\b/g, m=>map[m]).replace(/-/g,'–').replace(/;\s*/g,'; ');
  return s.length>70 ? s.slice(0,68)+'…' : s;
}

// шаги опроса; show — показывать ли шаг при текущих ответах
const STEPS = [
  {key:'who', q:'С кем проводите вечер?', opts:()=>dimOpts('who')},
  {key:'mood', q:'Какое настроение?', opts:()=>dimOpts('mood')},
  {key:'energy', q:'Сколько осталось сил?', opts:()=>dimOpts('energy')},
  {key:'place', q:'Дома или выбраться в город?', opts:()=>[opt1('place','home','Останусь дома'), opt1('place','out','Выберусь в город')]},
  {key:'day', q:'Когда?', show:()=>state.place==='out', opts:()=>dimOpts('day')},
  {key:'budget', q:'Сколько готовы потратить?', show:()=>state.place==='out', opts:()=>dimOpts('budget')},
  {key:'want', q:'Чего хочется?', sub:'Можно выбрать несколько или пропустить.', show:()=>state.place==='out', multi:true},
  {key:'where', q:'Где вам удобно?', sub:'Подберу места поближе. Можно пропустить и искать по всей Москве.', show:()=>state.place==='out' && hasData(), special:'where'},
  {key:'food', q:'Где поесть или выпить?', show:()=>state.place==='out', special:'food'},
];
const activeSteps = () => STEPS.filter(s=>!s.show || s.show());
let view = 'quiz', stepIdx = 0, editOne = false;
const answered = new Set();   // что человек выбрал в этом проходе опроса

function showView(v){
  view = v;
  $('quiz').hidden = v!=='quiz'; $('results').hidden = v!=='results';
  window.scrollTo({top:0});
}
function startQuiz(at){
  stepIdx = at||0; editOne = false; answered.clear();
  // новый проход: сбрасываем необязательные пожелания, прошлые ответы остаются для «Как в прошлый раз»
  Object.assign(state, {want:[], cuisine:'any', venue:'any', onlyTop:false, radius:'any'});
  showView('quiz'); drawStep('fwd');
}
const isOn = (key, v) => (answered.has(key) || editOne) && state[key]===v;
function drawStep(dir){
  const steps = activeSteps(); if(stepIdx>=steps.length){ finishQuiz(); return; }
  const st = steps[stepIdx];
  $('progress').innerHTML = steps.map((_,i)=>`<i class="${i<stepIdx+1?'done':''}"></i>`).join('');
  $('qback').hidden = stepIdx===0 && !editOne;
  $('stepno').textContent = `${stepIdx+1} из ${steps.length}`;
  let h = `<h1 class="q">${esc(st.q)}</h1>${st.sub?`<p class="qsub">${esc(st.sub)}</p>`:'<p class="qsub"></p>'}`;
  if(st.special==='where') h += whereHtml();
  else if(st.special==='food') h += foodHtml();
  else if(st.multi) h += wantHtml();
  else h += `<div class="opts">${st.opts().map(o=>optHtml(st.key, o)).join('')}</div>`;
  if(stepIdx===0 && !editOne && localStorage.getItem('evening-answered')) h += `<div class="qfoot"><button class="soft tap" data-q="same">${icon('refresh')}Как в прошлый раз</button></div>`;
  const stage = $('stage');
  stage.innerHTML = `<div class="step ${dir==='back'?'in-back':'in-fwd'}">${h}</div>`;
}
const optHtml = (key, o, small) => `<button class="opt glass tap" data-key="${key}" data-v="${o.v}" aria-pressed="${isOn(key,o.v)}">
  <span class="oi">${icon(o.icon)}</span><span><b>${esc(o.label)}</b>${o.sub?`<small>${esc(o.sub)}</small>`:''}</span><span class="check">${icon('check')}</span></button>`;
function wantHtml(){
  return `<div class="opts small">${WANT.map(w=>`<button class="opt glass tap" data-want="${w[0]}" aria-pressed="${state.want.includes(w[0])}">
    <span class="oi">${icon(WANT_ICON[w[0]]||'spark')}</span><b>${esc(w[1])}</b><span class="check">${icon('check')}</span></button>`).join('')}</div>
    <div class="qfoot"><button class="cta tap" data-q="next">${state.want.length?'Дальше':'Что угодно, дальше'}</button></div>`;
}
const WANT_ICON = {art:'book',stage:'ticket',movie:'film',active:'compass',games:'dice',walk:'pin',learn:'book',relax:'cup',kids:'family',night:'glass'};
function whereHtml(){
  const o = state.origin;
  return `<div class="field"><input class="input" id="qMetro" list="metrolist" placeholder="Станция метро, например «Чистые пруды»" value="${esc(o&&o.metro?o.name.replace(/^м\. /,''):'')}" autocomplete="off"></div>
    <div class="chipset"><button class="chip tap" data-q="geo" aria-pressed="${answered.has('where') && !!(o&&!o.metro)}">${icon('locate')}Рядом со мной</button>
    <button class="chip tap" data-q="nowhere" aria-pressed="${answered.has('where') && !o}">Вся Москва</button></div>
    <p class="lbl2">Насколько далеко готовы ехать</p>
    <span class="seg text" data-seg>${RADII.map(r=>`<button data-d="radius" data-v="${r[0]}" aria-pressed="${isOn('radius',r[0])}">${r[1]}</button>`).join('')}<i class="thumb"></i></span>
    <div class="qfoot"><button class="cta tap" data-q="next">Дальше</button></div>`;
}
function foodHtml(){
  const V = [['any','Что угодно','any'],['rest','Ресторан','fork'],['cafe','Кафе или кофейня','coffee'],['bar','Бар','bar']];
  return `<div class="opts small">${V.map(v=>`<button class="opt glass tap" data-key="venue" data-v="${v[0]}" data-stay="1" aria-pressed="${isOn('venue',v[0])}">
      <span class="oi">${icon(v[2])}</span><b>${v[1]}</b><span class="check">${icon('check')}</span></button>`).join('')}</div>
    <p class="lbl2">Кухня</p>
    <div class="chipset">${CUISINES.map(c=>`<button class="chip tap" data-key="cuisine" data-v="${c[0]}" data-stay="1" aria-pressed="${isOn('cuisine',c[0])}">${c[1]}</button>`).join('')}</div>
    <p class="lbl2">Качество</p>
    <div class="chipset"><button class="chip tap" data-q="top" aria-pressed="${!!state.onlyTop}">${icon('star')}Только места из гидов и премий</button></div>
    <div class="qfoot"><button class="cta tap" data-q="next">${icon('spark')}Показать вечер</button></div>`;
}
function nextStep(){
  if(editOne){ finishQuiz(); return; }
  stepIdx++; drawStep('fwd');
}
function finishQuiz(){
  save(); try{ localStorage.setItem('evening-answered','1'); localStorage.setItem('evening-last', JSON.stringify(state)); }catch(e){}
  buildResults(); showView('results'); renderResults(true);
}
// клики в опросе
$('quiz').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  if(b.id==='qback'){ if(editOne){ showView('results'); return; } if(stepIdx>0){ stepIdx--; drawStep('back'); } return; }
  if(b.dataset.want){
    const v = b.dataset.want; state.want = state.want.includes(v) ? state.want.filter(x=>x!==v) : state.want.concat(v);
    b.setAttribute('aria-pressed', state.want.includes(v)); const n = b.closest('.step').querySelector('[data-q="next"]'); if(n) n.textContent = state.want.length?'Дальше':'Что угодно, дальше';
    save(); return;
  }
  if(b.dataset.key){
    const key = b.dataset.key, v = b.dataset.v; state[key] = v; answered.add(key); save();
    b.parentElement.querySelectorAll(`[data-key="${key}"]`).forEach(x=>x.setAttribute('aria-pressed', x===b));
    if(!b.dataset.stay) setTimeout(nextStep, 320);
    return;
  }
  if(b.dataset.d){ state[b.dataset.d] = b.dataset.v; answered.add(b.dataset.d); save(); segPress(b); return; }
  const q = b.dataset.q;
  if(q==='next') nextStep();
  else if(q==='same'){ try{ Object.assign(state, JSON.parse(localStorage.getItem('evening-last')||'{}')); }catch(e){} finishQuiz(); }
  else if(q==='top'){ state.onlyTop = !state.onlyTop; b.setAttribute('aria-pressed', state.onlyTop); save(); }
  else if(q==='nowhere'){ setOrigin(null); if($('qMetro')) $('qMetro').value=''; drawStepKeep(); }
  else if(q==='geo'){
    if(!navigator.geolocation){ toast('Браузер не умеет определять местоположение'); return; }
    toast('Определяю, где вы');
    navigator.geolocation.getCurrentPosition(pos=>{ setOrigin({name:'ваше местоположение', la:pos.coords.latitude, lo:pos.coords.longitude}); toast('Буду искать рядом с вами'); drawStepKeep(); },
      ()=>toast('Не получилось определить место. Укажите станцию метро'), {timeout:8000, maximumAge:600000});
  }
});
$('quiz').addEventListener('change', e=>{
  if(e.target.id!=='qMetro') return;
  const m = findMetro(e.target.value);
  if(m){ setOrigin({name:'м. '+m[0], metro:1, la:m[1], lo:m[2]}); drawStepKeep(); } else if(e.target.value.trim()) toast('Не нашёл такую станцию');
});
function drawStepKeep(){
  // обновляем только состояние кнопок «Рядом со мной / Вся Москва», без перерисовки шага
  const o = state.origin, g = document.querySelector('[data-q="geo"]'), w = document.querySelector('[data-q="nowhere"]');
  answered.add('where');
  if(g) g.setAttribute('aria-pressed', !!(o&&!o.metro)); if(w) w.setAttribute('aria-pressed', !o);
  const inp = $('qMetro'); if(inp && o && o.metro) inp.value = o.name.replace(/^м\. /,'');
}
function findMetro(v){
  v = (v||'').trim().toLowerCase().replace(/ё/g,'е'); if(!v || !DATA || !DATA.metro) return null;
  const norm = x=>x.toLowerCase().replace(/ё/g,'е');
  return DATA.metro.find(x=>norm(x[0])===v) || DATA.metro.find(x=>norm(x[0]).startsWith(v)) || DATA.metro.find(x=>norm(x[0]).includes(v));
}
function setOrigin(o){ state.origin = o; Object.keys(seen).forEach(k=>delete seen[k]); save(); }

// ---------- переключатели со скользящим бегунком
function layoutSegs(root){
  (root||document).querySelectorAll('.seg').forEach(seg=>{
    let t = seg.querySelector(':scope>.thumb'); if(!t){ t = document.createElement('i'); t.className = 'thumb'; seg.appendChild(t); }
    const on = seg.querySelector(':scope>button[aria-pressed="true"]');
    if(!on){ t.style.opacity = 0; return; }
    t.style.opacity = 1; seg.style.setProperty('--x', on.offsetLeft+'px'); seg.style.setProperty('--w', on.offsetWidth+'px');
  });
}
function segPress(b){ const seg = b.closest('.seg'); seg.querySelectorAll(':scope>button').forEach(x=>x.setAttribute('aria-pressed', x===b)); layoutSegs(seg.parentElement); }
window.addEventListener('resize', ()=>layoutSegs());

// =====================================================================
//  Подборка: несколько вариантов в каждом разделе, один из них — «в плане»
// =====================================================================
let lists = {}, sel = {}, current = {};
const PAGE = 8;
function slots(){
  if(state.place==='home') return [['watch','Посмотреть'],['food','Поесть'],['do','Занятие'],['music','Фоном играет'],['rule','Правило вечера']];
  const S = [['go','Куда пойти']];
  if(DATA && DATA.films && DATA.films.length) S.push(['cinema','Сейчас в кино']);
  if(state.want.includes('movie')) S.reverse();
  return S.concat([['event','Событие'],['eat', eatTitle()],['music','Музыка в дорогу'],['rule','Правило вечера']]);
}
const eatTitle = () => state.venue==='bar' && state.who!=='family' ? 'Где выпить' : 'Где поесть';
function morePlaces(sec, n){
  const out = [], have = new Set((lists[sec]||[]).map(x=>x.p && pkey(x.p)));
  for(let i=0; i<n*3 && out.length<n; i++){
    let p = null;
    if(sec==='go'){
      p = pickPlace(activityWeights(), state.origin, radiusKm(), 'go', {maxPc:maxPc()});
      if(!p && state.origin && radiusKm()<1e8) p = pickPlace(activityWeights(), null, 1e9, 'go', {maxPc:maxPc()});
    } else {
      const g = lists.go && lists.go[sel.go], a = g && g.type==='place' ? g.p : state.origin;
      const steps = a ? (g && g.type==='place' ? [1.2,2.5,5,1e9] : [radiusKm(),1e9]) : [1e9];
      const opt = {maxPc: state.budget==='high' ? 3 : (state.budget==='low' && state.onlyTop ? 2 : 1), cuisine: cuisineKeys(), onlyTop: state.onlyTop};
      for(let j=0; j<steps.length && !p; j++) p = pickPlace(foodWeights(), a, steps[j], 'eat', Object.assign({}, opt, {minPool: j<steps.length-1 ? n : 0}));
    }
    if(!p) break;
    if(have.has(pkey(p))) continue;
    have.add(pkey(p)); out.push({type:'place', p});
  }
  return out;
}
function moreEvents(n){
  const out = [], have = new Set((lists.event||[]).map(x=>x.e.u));
  for(let i=0; i<n*3 && out.length<n; i++){
    let c = pickEvent(state.origin, radiusKm()); if(!c && state.origin) c = pickEvent(null, 1e9);
    if(!c) break; if(have.has(c.e.u)) continue; have.add(c.e.u); out.push({type:'event', e:c.e, sl:c.sl});
  }
  return out;
}
// фильмы в прокате: сначала свежие премьеры, в случайном порядке внутри недели
function moreFilms(n){
  const have = new Set((lists.cinema||[]).map(x=>x.f.id));
  const pool = (DATA && DATA.films || []).filter(f=>!have.has(f.id) && !(state.who==='family' && /ужас|триллер|эротик/.test((f.g||[]).join(' '))));
  const fresh = pool.slice(0, 12).sort(()=>Math.random()-.5), rest = pool.slice(12);
  return fresh.concat(rest).slice(0, n).map(f=>({type:'film', f, t:f.t, n:(f.g||[]).join(', ')}));
}
function moreIdeas(sec, n){
  const have = new Set((lists[sec]||[]).map(x=>x.t)), out = [];
  for(let i=0; i<n*6 && out.length<n; i++){ const it = pickIdea(DB[sec]); if(!have.has(it.t)){ have.add(it.t); out.push(it); } }
  return out;
}
function fillSection(sec){
  if(sec==='go' || sec==='eat') lists[sec] = hasData() ? morePlaces(sec, PAGE) : moreIdeas(sec==='go'?'go':'eatout', 4);
  else if(sec==='event') lists.event = hasData() ? moreEvents(PAGE) : [];
  else if(sec==='cinema') lists.cinema = moreFilms(PAGE);
  else if(sec==='music') lists.music = moreIdeas('music', 4);
  else if(sec==='rule') lists.rule = moreIdeas('rule', 1);
  else lists[sec] = moreIdeas(sec, sec==='watch' ? 6 : 4);
  sel[sec] = (sec==='event' || sec==='cinema') && !(sec==='cinema' && state.want.includes('movie')) ? -1 : 0;
}
function buildResults(){
  lists = {}; sel = {};
  slots().forEach(([k])=>fillSection(k==='eat' && !hasData() ? 'eat' : k));
  syncCurrent();
}
function syncCurrent(){
  current = {};
  slots().forEach(([k])=>{ const l = lists[k]||[], i = sel[k]; if(i>=0 && l[i]) current[k] = l[i]; });
}
// ---------- отрисовка
const SEC_ICON = {cinema:'film',go:'pin',event:'ticket',eat:'fork',music:'music',rule:'quote',watch:'film',food:'pan',do:'dice'};
const SEC_NOTE = {cinema:'премьеры последних недель', go:'нажмите, чтобы добавить в план', event:'по дате и настроению', eat:'рядом с выбранным местом', watch:'', food:'', do:'', music:''};
function answersHtml(){
  const A = [];
  const lab = (key)=>{ const d = DIMS.find(x=>x.key===key); const o = d && d.opts.find(x=>x[0]===state[key]); return o ? o[1] : ''; };
  const add = (key, text) => A.push(`<button class="tap" data-edit="${key}">${esc(text)}</button>`);
  add('who', lab('who')); add('mood', lab('mood')); add('energy', lab('energy')); add('place', state.place==='home'?'Дома':'В городе');
  if(state.place==='out'){
    add('day', lab('day')); add('budget', lab('budget'));
    add('want', state.want.length ? WANT.filter(w=>state.want.includes(w[0])).map(w=>w[1]).join(', ') : 'Что угодно');
    if(hasData()) add('where', state.origin ? state.origin.name : 'Вся Москва');
    const ven = {any:'Еда: любая',rest:'Ресторан',cafe:'Кафе',bar:'Бар'}[state.venue];
    const cu = state.cuisine!=='any' ? ', '+CUISINES.find(c=>c[0]===state.cuisine)[1].toLowerCase() : '';
    add('food', ven+cu+(state.onlyTop?', из гидов':''));
  }
  return A.join('');
}
function renderResults(anim){
  syncCurrent();
  const S = slots();
  let h = `<div class="rhead"><h1>${state.place==='home'?'Вечер дома':'Ваш вечер в Москве'}</h1><div class="answers">${answersHtml()}</div></div>`;
  h += `<section class="plan glass"><h2>План на вечер</h2><div class="plist">${
    S.map(([k,t])=>{ const it = current[k]; if(!it) return ''; return `<div class="pline"><em>${esc(t)}</em><b>${esc(itTitle(it))}</b></div>`; }).join('')
  }</div><div class="pacts">
    <button class="soft tap" id="savePlan">${icon('bookmark')}Сохранить вечер</button>
    <button class="soft tap" id="copy">${icon('copy')}Скопировать план</button>
    <button class="soft tap" data-r="shuffle">${icon('shuffle')}Подобрать другие</button>
    <button class="soft tap" data-r="restart">${icon('refresh')}Ответить заново</button></div></section>`;
  S.forEach(([k,t])=>{
    const l = lists[k]||[];
    if(k==='event' && !l.length){ if(hasData()) h += `<section class="sec"><div class="sechead"><h2>${icon('ticket')}События</h2></div><p class="empty">На выбранный день в афише нет подходящих событий. ${afishaBtn()}</p></section>`; return; }
    if(k==='rule'){
      const it = l[0]; if(!it) return;
      h += `<section class="sec" data-sec="rule"><div class="wide-card glass"><div><div class="kind" style="margin-bottom:6px">${icon('quote')} Правило вечера</div><div class="name">${esc(it.t)}</div><div class="note">${esc(it.n)}</div></div>
        <span class="tools">${favBtn('rule',0)}<button class="ib tap" data-r="rerule" title="Другое правило" aria-label="Другое правило">${icon('shuffle')}</button></span></div></section>`;
      return;
    }
    const smallCards = k==='music' || k==='food' || k==='do';
    h += `<section class="sec" data-sec="${k}"><div class="sechead"><h2>${icon(SEC_ICON[k]||'spark')}${esc(k==='event'?'События':t)}${SEC_NOTE[k]&&l.length>1?`<small>${SEC_NOTE[k]}</small>`:''}</h2>
      <button class="ib tap" data-r="reshuffle" title="Другие варианты" aria-label="Другие варианты">${icon('shuffle')}</button></div>`;
    if(!l.length) h += `<p class="empty">Под такие условия ничего не нашлось. Попробуйте увеличить бюджет или радиус либо снять часть пожеланий.</p>`;
    else h += `<div class="lane${smallCards?' small-cards':''}">${l.map((it,i)=>cardHtml(k,it,i,anim)).join('')}${
      (k==='go'||k==='eat'||k==='event'||k==='watch'||k==='cinema') ? `<button class="more tap" data-r="more"><span>${icon('plus')}</span>Ещё варианты</button>` : ''}</div>`;
    h += `</section>`;
  });
  $('rbody').innerHTML = h;
  exhausted.clear(); requestAnimationFrame(()=>document.querySelectorAll('.lane').forEach(laneEdges));
  $('foot') && ($('foot').hidden = true);
  bindPlanButtons();
}
const itTitle = it => it.type==='place' ? it.p.n : it.type==='event' ? it.e.t : it.t;
function favBtn(k, i){ const x = itemFor(k,i), f = isFav(x); return `<button class="ib fav tap" data-r="fav" data-i="${i}" aria-pressed="${f}" title="${f?'Убрать из избранного':'В избранное'}" aria-label="В избранное">${icon(f?'heartf':'heart')}</button>`; }
function cardHtml(k, it, i, anim){
  const isSel = sel[k]===i;
  const tools = `<span class="tools">${favBtn(k,i)}${it.type==='place'?`<button class="ib tap" data-r="hide" data-i="${i}" title="Больше не предлагать" aria-label="Больше не предлагать">${icon('eyeoff')}</button>`:''}</span>`;
  let kind = '', body = '';
  if(it.type==='place'){
    const p = it.p; kind = KIND[p.k]||'Место';
    const meta = [];
    if(p.m) meta.push(`<div><span>Метро:</span> ${esc(p.m)}${p.md!=null?', '+kmText(p.md):''}</div>`);
    const pr = priceText(p); if(pr) meta.push(`<div><span>Цены:</span> ${pr}</div>`);
    if(p.h) meta.push(`<div><span>Часы:</span> ${esc(hoursRu(p.h))}</div>`);
    const a = k==='eat' && lists.go && lists.go[sel.go] && lists.go[sel.go].type==='place' ? lists.go[sel.go].p : state.origin;
    if(a && a!==p) meta.push(`<div><span>${k==='eat'&&a!==state.origin?'От места':'От вас'}:</span> ${kmText(dist(a.la,a.lo,p.la,p.lo))}</div>`);
    body = `${p.g?`<div class="guide">${icon('star')}<span>${p.g.map(esc).join('<br>')}</span></div>`:''}<div class="name">${esc(p.n)}</div>
      <div class="note">${esc([p.c, p.a].filter(Boolean).join('. '))}</div><div class="meta">${meta.join('')}</div>
      <div class="links"><a class="main" href="${esc(yandex(p))}" target="_blank" rel="noopener">${icon('map')}Отзывы</a>${safeUrl(p.w)?`<a href="${esc(p.w)}" target="_blank" rel="noopener">Сайт</a>`:''}</div>`;
  } else if(it.type==='film'){
    const f = it.f, d = new Date(f.pr+'T12:00:00');
    kind = 'Фильм в прокате';
    const started = d <= new Date();
    const meta = [`<div><span>${started?'В кино с':'Премьера'}:</span> ${d.toLocaleDateString('ru-RU',{day:'numeric',month:'long'})}</div>`];
    if(f.d) meta.push(`<div><span>Длительность:</span> ${Math.floor(f.d/60)?Math.floor(f.d/60)+' ч ':''}${f.d%60} мин</div>`);
    if(f.c && f.c.length) meta.push(`<div><span>Страна:</span> ${esc(f.c.join(', '))}</div>`);
    body = `<div class="name">${esc(f.t)}</div><div class="note">${esc((f.g||[]).join(', '))}${f.y?', '+f.y:''}</div><div class="meta">${meta.join('')}</div>

const loading = new Set(), exhausted = new Set();
function appendMore(k, lane, loud){
  if(!lane || loading.has(k)) return;
  if(exhausted.has(k)){ if(loud) toast('Больше вариантов под эти условия нет'); return; }
  loading.add(k);
  const add = k==='event' ? moreEvents(6) : k==='cinema' ? moreFilms(6) : (k==='go'||k==='eat') && hasData() ? morePlaces(k, 6) : moreIdeas(k==='eat'?'eatout':k, 4);
  if(!add.length){ exhausted.add(k); loading.delete(k); const m = lane.querySelector('.more'); if(m) m.remove(); if(loud) toast('Больше вариантов под эти условия нет'); return; }
  const n0 = lists[k].length; lists[k] = lists[k].concat(add);
  const m = lane.querySelector('.more'), html = add.map((it,j)=>cardHtml(k,it,n0+j,true)).join('');
  if(m) m.insertAdjacentHTML('beforebegin', html); else lane.insertAdjacentHTML('beforeend', html);
  laneEdgesSoon(lane);
  setTimeout(()=>loading.delete(k), 250);
}
function laneEdges(lane){
  const L = lane.getBoundingClientRect(), pad = parseFloat(getComputedStyle(lane).paddingLeft) - 2;
  for(const c of lane.children){
    const r = c.getBoundingClientRect(); let d = 0, o = 'center';
    if(r.left < L.left + pad){ d = (L.left + pad - r.left) / r.width * 1.6; o = 'right center'; }
    else if(r.right > L.right - pad){ d = (r.right - L.right + pad) / r.width * 1.6; o = 'left center'; }
    d = Math.max(0, Math.min(1, d));
    c.style.setProperty('--d', d.toFixed(3)); c.style.transformOrigin = o;
  }
}
const laneRaf = new WeakMap();
function laneEdgesSoon(lane){ if(laneRaf.get(lane)) return; laneRaf.set(lane, requestAnimationFrame(()=>{ laneRaf.delete(lane); laneEdges(lane); })); }
addEventListener('resize', ()=>document.querySelectorAll('.lane').forEach(laneEdgesSoon));
$('rbody').addEventListener('scroll', e=>{

function itemOf(k){
  const it = current[k]; if(!it) return null;

    return {id:'p:'+pkey(p), kind:'place', slot:k, title:p.n, sub:[KIND[p.k], p.a, p.m?'м. '+p.m:''].filter(Boolean).join(' · '), url:yandex(p), p}; }

    return {id:'e:'+e.u, kind:'event', slot:k, title:e.t, sub:[fmtWhen(it.sl), e.p].filter(Boolean).join(' · '), url:e.u}; }

const b64e = s => btoa(unescape(encodeURIComponent(s))), b64d = s => decodeURIComponent(escape(atob(s)));
let wipeArmed = false;
async function settingsAction(a){
  if(['login','signup','google','resetpass','logout'].includes(a)){
    if(window.accountAction) window.accountAction(a, (document.getElementById('accEmail')||{}).value||'', (document.getElementById('accPass')||{}).value||'');

    return;
  }
  if(a==='metro'){
    const el = document.getElementById('setMetro'); if(!el) return;
    const v = el.value.trim().toLowerCase().replace(/ё/g,'е'), norm = x=>x.toLowerCase().replace(/ё/g,'е');
    const m = DATA.metro.find(x=>norm(x[0])===v) || DATA.metro.find(x=>norm(x[0]).startsWith(v));
    if(m){ setOrigin({name:'м. '+m[0], metro:1, la:m[1], lo:m[2]}); toast('Буду искать рядом с м. '+m[0]); drawSettings(); } else toast('Не нашёл такую станцию');
  } else if(a==='nometro'){ setOrigin(null); toast('Ищу по всей Москве'); drawSettings(); }
  else if(a==='unhide'){ hidden.clear(); saveHidden(); toast('Скрытые места снова в подборе'); drawSettings(); }
  else if(a==='export'){
    const code = b64e(JSON.stringify({v:1, user:Store.data, hidden:[...hidden], state}));
    try{ await navigator.clipboard.writeText(code); toast('Код скопирован'); }
    catch(e){ document.getElementById('importCode').value = code; toast('Скопируйте код из поля ниже'); }
  } else if(a==='import'){
    try{
      const d = JSON.parse(b64d(document.getElementById('importCode').value.trim()));
      if(!d || d.v!==1) throw 0;
      const ids = new Set(Store.data.favs.map(f=>f.id)), pids = new Set(Store.data.plans.map(f=>f.id));
      Store.data.favs = Store.data.favs.concat((d.user.favs||[]).filter(f=>!ids.has(f.id)));
      Store.data.plans = Store.data.plans.concat((d.user.plans||[]).filter(f=>!pids.has(f.id)));
      Store.save(); (d.hidden||[]).forEach(x=>hidden.add(x)); saveHidden();
      Object.assign(state, d.state||{}); save(); drawControls();
      toast('Данные загружены'); drawSettings();
    }catch(e){ toast('Код не подошёл. Скопируйте его целиком'); }
  } else if(a==='reset'){
    Object.assign(state, {who:'duo',mood:'cozy',energy:'mid',budget:'low',place:'out',day:'today',radius:'any',origin:null,want:[],cuisine:'any',onlyTop:false,venue:'any'});
    save(); drawControls(); toast('Параметры сброшены'); drawSettings();
  } else if(a==='wipe'){
    if(!wipeArmed){ wipeArmed = true; toast('Нажмите ещё раз, чтобы удалить избранное, вечера и скрытые места'); setTimeout(()=>wipeArmed=false, 4000); return; }
    wipeArmed = false; Store.data = {favs:[], plans:[]}; Store.save(); hidden.clear(); saveHidden();
    toast('Все данные удалены'); drawSettings(); if(Object.keys(current).length) render(false);
  }
}

// ---------- обмен данными с облаком (используется модулем аккаунтов ниже)
window.Vecher = {
  getUserData(){ return {favs:Store.data.favs.slice(0,500), plans:Store.data.plans.slice(0,100), hidden:[...hidden], state:JSON.parse(JSON.stringify(state))}; },
  // объединение при входе: ничего не теряем ни с устройства, ни из облака
  merge(local, cloud){
    if(!cloud) return local;
    const uni = (a,b)=>{ const ids = new Set(a.map(x=>x.id)); return a.concat(b.filter(x=>!ids.has(x.id))); };
    return {favs:uni(cloud.favs||[], local.favs||[]).sort((x,y)=>(y.ts||0)-(x.ts||0)),
            plans:uni(cloud.plans||[], local.plans||[]).sort((x,y)=>(y.ts||0)-(x.ts||0)),
            hidden:[...new Set([...(cloud.hidden||[]), ...(local.hidden||[])])],
            state:Object.assign({}, local.state, cloud.state||{})};
  },
  // применить данные из облака, не отправляя их обратно
  apply(d){
    const keep = window.onUserDataChange; window.onUserDataChange = null;
    try{
      Store.data = {favs:d.favs||[], plans:d.plans||[]}; Store.save();
      hidden = new Set(d.hidden||[]); saveHidden();
      if(d.state){ Object.assign(state, d.state); if(!Array.isArray(state.want)) state.want = []; save(); }
      drawControls(); if(Object.keys(current).length) render(false);
    } finally { window.onUserDataChange = keep; }
  },
  toast, drawSettings,
};
const Account = { enabled: !!window.FIREBASE_CONFIG, user: null, busy: false };
window.Vecher.setUser = u => { Account.user = u; updateAccButton(); if(!modal.hidden && document.getElementById('mTitle').textContent==='Настройки') drawSettings(); };
updateAccButton();
function accountHtml(){
  if(!Account.enabled) return `<p class="muted">Вход и синхронизация пока не подключены. Чтобы перенести данные, используйте код ниже.</p>`;
  if(Account.user) return `<p class="muted">Вы вошли как <b>${esc(Account.user.email||Account.user.displayName||'пользователь')}</b>. Избранное, вечера, скрытые места и параметры синхронизируются на всех устройствах, где вы вошли.</p>
    <div class="field"><button class="chip" data-set="logout">Выйти</button></div>`;
  return `<p class="muted">Войдите, чтобы избранное и настройки были на всех ваших устройствах. Всё, что уже сохранено в этом браузере, перенесётся в аккаунт.</p>
    <div class="field"><input id="accEmail" type="email" placeholder="почта" autocomplete="email"><input id="accPass" type="password" placeholder="пароль, от 6 символов" autocomplete="current-password"></div>
    <div class="field"><button class="chip primary" data-set="login">Войти</button><button class="chip" data-set="signup">Зарегистрироваться</button><button class="chip" data-set="google">Войти через Google</button><button class="chip" data-set="resetpass">Забыли пароль?</button></div>`;
}

let toastTimer;
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2200); }

// ---------- загрузка базы ----------
function credits(){
  let h = '';
  if(hasData()){
    const d = new Date(DATA.updated);
    const when = isNaN(d) ? '' : d.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});
    h += `Мест в базе: ${DATA.places.length.toLocaleString("ru-RU")} · событий: ${(DATA.events||[]).length.toLocaleString("ru-RU")}${when?' · обновлено '+when:''}<br>`;
  }
  h += 'Места: © участники <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> (ODbL), события: <a href="https://www.mos.ru/afisha/" target="_blank" rel="noopener">афиша mos.ru</a><br>Значком со звездой отмечены места из гидов Ultima Guide, премии WhereToEat и подборок «Афиши Daily». У остальных оценок нет, а часть могла закрыться. Перед выходом проверьте место по ссылке на карты. Перечёркнутый глаз на карточке убирает место из подбора, нажатие на карточку добавляет её в план.';
  document.getElementById('credits').innerHTML = h;
}
function banner(){
  const b = document.getElementById('banner');
  if(!hasData()) b.innerHTML = '<div class="banner glass">База мест пока не загрузилась, поэтому для города показываю общие идеи. Режим «Дома» работает полностью.</div>';
  else if(DATA.demo) b.innerHTML = '<div class="banner glass">Сейчас в базе демо-набор из нескольких десятков известных мест. Полная база Москвы появится после первого автоматического обновления.</div>';
  else b.innerHTML = '';
}
function init(){
  paintIcons(); setTheme(document.documentElement.getAttribute('data-theme')||'system');
  if(DATA && DATA.metro) document.getElementById('metrolist').innerHTML = DATA.metro.map(m=>`<option value="${esc(m[0])}">`).join('');
  if(state.origin && state.origin.metro && !(DATA && DATA.metro && DATA.metro.length)) state.origin = null;
  banner(); credits();
}

  .then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(d=>{ if(d && Array.isArray(d.places)){ DATA = d; init(); if(view==='quiz'){ const st = $('stage').querySelector('.step'); drawStep(); const n = $('stage').querySelector('.step'); if(n) n.className = 'step'; } layoutSegs(); } })
  .catch(()=>{});

<script type="module">
// Аккаунты и синхронизация через Firebase. Включаются, только если заполнен firebase-config.js.
const cfg = window.FIREBASE_CONFIG;
if(cfg){
  const V = 'https://www.gstatic.com/firebasejs/10.12.2/';
  try{
    const {initializeApp} = await import(V+'firebase-app.js');
    const A = await import(V+'firebase-auth.js');
    const F = await import(V+'firebase-firestore.js');
    const app = initializeApp(cfg), auth = A.getAuth(app), db = F.getFirestore(app);
    auth.languageCode = 'ru';
    let unsub = null, timer = null, lastSent = '';
    const ERR = {
      'auth/invalid-email':'Почта указана неверно', 'auth/missing-password':'Введите пароль',
      'auth/weak-password':'Пароль слишком короткий, нужно от 6 символов', 'auth/email-already-in-use':'Такая почта уже зарегистрирована, нажмите «Войти»',
      'auth/invalid-credential':'Неверная почта или пароль', 'auth/user-not-found':'Такой почты нет, нажмите «Зарегистрироваться»',
      'auth/wrong-password':'Неверный пароль', 'auth/too-many-requests':'Слишком много попыток, подождите немного',
      'auth/popup-closed-by-user':'Окно входа закрыто', 'auth/network-request-failed':'Нет связи с сервером входа',
      'auth/unauthorized-domain':'Этот адрес сайта не разрешён в настройках Firebase',
    };
    const say = e => window.Vecher.toast(ERR[e && e.code] || ('Ошибка: '+((e && e.code) || e)));
    const push = () => {
      const u = auth.currentUser; if(!u) return;
      clearTimeout(timer);
      timer = setTimeout(async ()=>{
        const d = window.Vecher.getUserData(), js = JSON.stringify(d);
        if(js===lastSent) return; lastSent = js;
        try{ await F.setDoc(F.doc(db,'users',u.uid), Object.assign(d, {updated:F.serverTimestamp()})); }
        catch(e){ console.warn('sync', e); }
      }, 800);
    };
    window.accountAction = async (a, email, pass) => {
      try{
        if(a==='login') await A.signInWithEmailAndPassword(auth, email.trim(), pass);
        else if(a==='signup') await A.createUserWithEmailAndPassword(auth, email.trim(), pass);
        else if(a==='google') await A.signInWithPopup(auth, new A.GoogleAuthProvider());
        else if(a==='resetpass'){ await A.sendPasswordResetEmail(auth, email.trim()); window.Vecher.toast('Письмо для смены пароля отправлено'); }
        else if(a==='logout'){ await A.signOut(auth); window.Vecher.toast('Вы вышли. Данные остались в этом браузере'); }
      }catch(e){ say(e); }
    };
    A.onAuthStateChanged(auth, async u => {
      if(unsub){ unsub(); unsub = null; }
      window.onUserDataChange = null;
      window.Vecher.setUser(u);
      if(!u) return;
      const ref = F.doc(db,'users',u.uid);
      try{
        const snap = await F.getDoc(ref);
        const merged = window.Vecher.merge(window.Vecher.getUserData(), snap.exists() ? snap.data() : null);
        window.Vecher.apply(merged);
        lastSent = JSON.stringify(window.Vecher.getUserData());
        await F.setDoc(ref, Object.assign(window.Vecher.getUserData(), {updated:F.serverTimestamp()}));
        window.Vecher.toast('Вход выполнен, данные синхронизированы');
      }catch(e){ console.warn(e); window.Vecher.toast('Не удалось загрузить данные из аккаунта'); }
      window.onUserDataChange = push;
      // изменения с других устройств
      unsub = F.onSnapshot(ref, s => {
        if(!s.exists() || s.metadata.hasPendingWrites) return;
        const d = s.data(), mine = JSON.stringify(window.Vecher.getUserData());
        const theirs = JSON.stringify({favs:d.favs||[], plans:d.plans||[], hidden:d.hidden||[], state:d.state||{}});
        if(theirs!==mine){ lastSent = theirs; window.Vecher.apply(d); }
      });
    });
  }catch(e){
    console.warn('Firebase не загрузился', e);
    window.Vecher.toast('Сервис входа сейчас недоступен. Избранное сохраняется в этом браузере');
  }
}
</script>
