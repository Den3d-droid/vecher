<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вечер в Москве</title>
<meta name="description" content="Собирает план на вечер из реальных мест и событий Москвы.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#10142b">
<style>
/* Вечер в Москве: сумерки за стеклом. Фон — огни города, всё управление — на стекле поверх них. */
:root{
  --ink:#10142b; --dusk:#2b2560; --amber:#ffb547; --rose:#ff5d7a; --teal:#38c7c0;
  --text:#f6f4ff; --muted:rgba(246,244,255,.64); --faint:rgba(246,244,255,.38);
  --glass:rgba(255,255,255,.075); --glass-2:rgba(255,255,255,.13); --glass-hi:rgba(255,255,255,.22);
  --edge:rgba(255,255,255,.18); --edge-lo:rgba(255,255,255,.05);
  --shadow:0 18px 50px rgba(5,6,22,.45);
  --amber-ink:#2a1700;
  --r-xl:34px; --r-l:26px; --r-m:18px; --r-s:12px;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root{
    --ink:#e9eefb; --dusk:#c9d4f4; --text:#171a2e; --muted:rgba(23,26,46,.62); --faint:rgba(23,26,46,.4);
    --glass:rgba(255,255,255,.46); --glass-2:rgba(255,255,255,.62); --glass-hi:rgba(255,255,255,.85);
    --edge:rgba(255,255,255,.9); --edge-lo:rgba(23,26,46,.06); --shadow:0 18px 50px rgba(40,50,110,.16);
    color-scheme:light;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Onest",system-ui,sans-serif;color:var(--text);background:var(--ink);min-height:100vh;
  line-height:1.5;font-size:16px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
/* огни города за стеклом */
.lights{position:fixed;inset:-10vmax;z-index:-1;pointer-events:none;
  background:
   radial-gradient(38vmax 30vmax at 12% 18%, rgba(255,181,71,.55), transparent 62%),
   radial-gradient(30vmax 26vmax at 88% 12%, rgba(255,93,122,.42), transparent 60%),
   radial-gradient(42vmax 34vmax at 78% 78%, rgba(56,199,192,.32), transparent 62%),
   radial-gradient(36vmax 30vmax at 22% 88%, rgba(124,92,255,.45), transparent 60%),
   linear-gradient(170deg, var(--dusk), var(--ink) 70%);}
@media (prefers-color-scheme: light){
  .lights{background:
   radial-gradient(38vmax 30vmax at 12% 18%, rgba(255,190,110,.7), transparent 62%),
   radial-gradient(30vmax 26vmax at 88% 12%, rgba(255,140,165,.55), transparent 60%),
   radial-gradient(42vmax 34vmax at 78% 78%, rgba(110,220,210,.5), transparent 62%),
   radial-gradient(36vmax 30vmax at 22% 88%, rgba(150,135,255,.5), transparent 60%),
   linear-gradient(170deg, #f3f6ff, #dfe6fb 70%);}
}
/* стекло: размытие фона, светлая кромка сверху, блик */
.glass{position:relative;background:var(--glass);border-radius:var(--r-l);
  -webkit-backdrop-filter:blur(26px) saturate(185%);backdrop-filter:blur(26px) saturate(185%);
  box-shadow:inset 0 1px 0 var(--edge), inset 0 0 0 1px var(--edge-lo), var(--shadow)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(135deg, rgba(255,255,255,.16), rgba(255,255,255,0) 38%, rgba(255,255,255,0) 70%, rgba(255,255,255,.06))}
.wrap{max-width:1040px;margin:0 auto;padding:18px 18px 64px}
.topnav{position:sticky;top:12px;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 8px 8px 18px;border-radius:999px;margin-bottom:44px}
.brand{font-weight:650;letter-spacing:-.02em;font-size:17px}
.navbtns{display:flex;gap:6px}
.pill{display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;font:inherit;font-size:15px;color:var(--text);
  background:transparent;padding:9px 14px;border-radius:999px;transition:background .2s}
.pill:hover{background:var(--glass-2)}
.pill svg{width:18px;height:18px;flex:none}
.count{font-variant-numeric:tabular-nums;color:var(--muted)}
header{margin:0 4px 26px}
h1{font-weight:650;font-size:clamp(40px,7vw,76px);line-height:1;letter-spacing:-.045em;max-width:12ch}
.today{margin-top:14px;color:var(--muted);font-size:17px}
.sub{color:var(--muted);max-width:56ch;margin-top:6px}
.controls{padding:22px 22px 12px;border-radius:var(--r-xl)}
.row{display:grid;grid-template-columns:118px 1fr;gap:12px;align-items:center;margin-bottom:12px}
.row[hidden]{display:none}
.label{color:var(--muted);font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
/* одиночный выбор — сегментированный переключатель */
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;border-radius:14px;background:rgba(0,0,0,.18);box-shadow:inset 0 1px 2px rgba(0,0,0,.18)}
@media (prefers-color-scheme: light){ .seg{background:rgba(23,26,46,.07)} }
.chip{border:0;background:transparent;color:var(--text);padding:7px 13px;border-radius:11px;font:inherit;font-size:14px;cursor:pointer;
  transition:background .2s, box-shadow .2s, color .2s;white-space:nowrap}
.chip:hover{background:var(--glass)}
.chip[aria-pressed="true"]{background:var(--glass-hi);box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 2px 10px rgba(0,0,0,.18);font-weight:600}
@media (prefers-color-scheme: light){ .chip[aria-pressed="true"]{background:#fff;box-shadow:0 1px 0 rgba(255,255,255,.9) inset, 0 2px 8px rgba(40,50,110,.14)} }
/* множественный выбор — отдельные капсулы */
.multi .chip{border-radius:999px;background:var(--glass);box-shadow:inset 0 0 0 1px var(--edge-lo)}
.multi .chip[aria-pressed="true"]{background:var(--amber);color:var(--amber-ink);box-shadow:none}
.chip.toggle{border-radius:999px;box-shadow:inset 0 0 0 1px var(--edge)}
.chip.toggle[aria-pressed="true"]{background:var(--amber);color:var(--amber-ink);box-shadow:none}
.chip svg{width:15px;height:15px;vertical-align:-2px;margin-right:4px}
.metro{border:0;background:var(--glass);box-shadow:inset 0 0 0 1px var(--edge-lo);color:var(--text);padding:8px 14px;border-radius:999px;font:inherit;font-size:14px;width:200px;max-width:100%}
.metro::placeholder{color:var(--faint)}
.where{grid-column:2;color:var(--muted);font-size:13px;margin-top:-4px}
.go{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin:10px 0 8px;border:0;cursor:pointer;
  font:inherit;font-size:18px;font-weight:650;letter-spacing:-.01em;color:var(--amber-ink);padding:17px 24px;border-radius:20px;
  background:linear-gradient(180deg, #ffd27d, var(--amber));box-shadow:inset 0 1px 0 rgba(255,255,255,.7), 0 10px 30px rgba(255,181,71,.35);transition:transform .15s}
.go:active{transform:scale(.985)}
.go svg{width:20px;height:20px}
#out{margin-top:26px}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
.card{padding:20px;display:flex;flex-direction:column;min-width:0;grid-column:span 3;border-radius:var(--r-l)}
.card.lead{grid-column:span 4;grid-row:span 2;padding:26px}
.card.side{grid-column:span 2}
.card.wide{grid-column:1/-1}
.card.locked{box-shadow:inset 0 0 0 2px var(--amber), var(--shadow)}
.ctop{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.ctitle{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px}
.ctitle svg{width:17px;height:17px}
.btns{display:flex;gap:4px}
.ib{width:34px;height:34px;border-radius:50%;border:0;background:var(--glass);color:var(--text);cursor:pointer;display:grid;place-items:center;transition:background .2s}
.ib svg{width:17px;height:17px}
.ib:hover{background:var(--glass-2)}
.ib[aria-pressed="true"]{background:var(--amber);color:var(--amber-ink)}
.ib.fav[aria-pressed="true"]{background:var(--rose);color:#fff}
.main{font-weight:650;font-size:23px;line-height:1.2;letter-spacing:-.02em;margin-bottom:6px;overflow-wrap:anywhere}
.lead .main{font-size:clamp(28px,3.4vw,40px);letter-spacing:-.035em}
.wide .main{font-size:21px}
.note{color:var(--muted);font-size:15px}
.guide{display:inline-flex;align-items:flex-start;gap:6px;font-size:13px;line-height:1.35;color:var(--text);background:rgba(255,181,71,.18);
  box-shadow:inset 0 0 0 1px rgba(255,181,71,.4);border-radius:12px;padding:6px 10px;margin-bottom:12px;align-self:flex-start}
.guide svg{width:14px;height:14px;color:var(--amber);flex:none;margin-top:1px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.tag{font-size:13px;color:var(--muted);background:var(--glass);border-radius:999px;padding:3px 10px}
.meta{font-size:15px;margin-top:12px;display:grid;gap:4px}
.meta span{color:var(--muted)}
.links{margin-top:auto;padding-top:16px;display:flex;flex-wrap:wrap;gap:8px}
.links a{text-decoration:none;font-size:14px;font-weight:600;padding:9px 14px;border-radius:999px;color:var(--amber-ink);background:var(--amber)}
.links a.sec{background:var(--glass);color:var(--text);font-weight:500;box-shadow:inset 0 0 0 1px var(--edge-lo)}
.links a:hover{filter:brightness(1.06)}
.foot{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.ghost{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--glass);color:var(--text);padding:10px 16px;border-radius:999px;font:inherit;font-size:15px;cursor:pointer;
  -webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:inset 0 1px 0 var(--edge)}
.ghost:hover{background:var(--glass-2)}
.ghost svg{width:17px;height:17px}
.empty{color:var(--muted);padding:6px 4px}
.banner{padding:14px 18px;margin-bottom:14px;font-size:15px;border-radius:var(--r-m)}
.credits{margin-top:56px;color:var(--faint);font-size:13px;line-height:1.7;max-width:70ch}
.credits a{color:var(--muted)}
/* появление плана: один раз, лесенкой */
.grid.enter .card{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.grid.enter .card:nth-child(2){animation-delay:.05s}.grid.enter .card:nth-child(3){animation-delay:.1s}
.grid.enter .card:nth-child(4){animation-delay:.15s}.grid.enter .card:nth-child(5){animation-delay:.2s}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.card.swap .main,.card.swap .meta,.card.swap .note{animation:fadein .35s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
/* окно */
.modal{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-start;justify-content:center;padding:6vh 14px;overflow:auto;
  background:rgba(8,10,28,.35);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.modal[hidden]{display:none}
.sheet{width:100%;max-width:640px;padding:24px;border-radius:var(--r-xl);background:var(--glass-2)}
.sheethead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sheet h2{font-weight:650;font-size:28px;letter-spacing:-.03em}
.sheet h3{font-size:17px;font-weight:650;margin:22px 0 8px}
.tabs{display:inline-flex;margin-bottom:12px}
.fitem{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding:12px 0;border-top:1px solid var(--edge-lo)}
.fitem .ft{font-weight:600}.fitem .fs{color:var(--muted);font-size:14px;white-space:pre-line}
.fitem a{color:var(--text);font-size:14px}
.field{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.field input,.field textarea{background:var(--glass);border:0;box-shadow:inset 0 0 0 1px var(--edge-lo);color:var(--text);border-radius:12px;padding:10px 13px;font:inherit;font-size:15px}
.field input{flex:1;min-width:180px}
.field textarea{width:100%;min-height:72px;font-size:12px}
.field .chip{background:var(--glass);border-radius:999px;box-shadow:inset 0 0 0 1px var(--edge-lo)}
.muted{color:var(--muted);font-size:15px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(16px);padding:11px 18px;border-radius:999px;font-weight:600;font-size:15px;
  color:var(--text);background:var(--glass-2);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);
  box-shadow:inset 0 1px 0 var(--edge), var(--shadow);opacity:0;transition:.25s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .glass,.sheet{background:rgba(30,32,64,.92)}
  @media (prefers-color-scheme: light){ .glass,.sheet{background:rgba(255,255,255,.94)} }
}
@media (prefers-reduced-motion: reduce){ *{animation:none!important;transition:none!important} }
@media (max-width:820px){
  .grid{grid-template-columns:1fr 1fr}
  .card,.card.side{grid-column:span 1}.card.lead,.card.wide{grid-column:1/-1;grid-row:auto}
}
@media (max-width:600px){
  .wrap{padding:10px 12px 48px}
  .topnav{margin-bottom:30px;padding-left:14px}
  .pill .lbl{display:none}
  .row{grid-template-columns:1fr;gap:6px}
  .where{grid-column:1}
  .controls{padding:16px 14px 6px}
  .chips{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:2px 14px}
  .chips::-webkit-scrollbar{display:none}
  .seg{flex-wrap:nowrap}
  .grid{grid-template-columns:1fr}
  .card,.card.side,.card.lead,.card.wide{grid-column:1/-1}
}
</style>
</head>
<body>
<div class="lights" aria-hidden="true"></div>
<div class="wrap">
  <nav class="topnav glass">
    <span class="brand">Вечер в Москве</span>
    <span class="navbtns">
      <button class="pill" id="openFav" aria-label="Избранное"><span class="ico" data-i="heart"></span><span class="lbl">Избранное</span> <span class="count" id="favCount"></span></button>
      <button class="pill" id="openSet" aria-label="Настройки"><span class="ico" data-i="gear"></span><span class="lbl">Настройки</span></button>
      <button class="pill" id="openAcc" hidden><span class="ico" data-i="user"></span><span class="lbl" id="accLbl">Войти</span></button>
    </span>
  </nav>
  <header>
    <h1>Чем заняться сегодня вечером</h1>
    <p class="today" id="today"></p>
  </header>

  <div id="banner"></div>
  <section class="controls glass">
    <div id="controls"></div>
    <button class="go" id="go"><span class="ico" data-i="spark"></span>Собрать вечер</button>
  </section>

  <section id="out"><p class="empty">Выберите, с кем и в каком настроении, и нажмите «Собрать вечер». Понравившиеся пункты можно закрепить, остальные — заменить.</p></section>

  <div class="foot" id="foot" hidden>
    <button class="ghost" id="savePlan"><span class="ico" data-i="bookmark"></span>Сохранить вечер</button>
    <button class="ghost" id="copy"><span class="ico" data-i="copy"></span>Скопировать план</button>
    <button class="ghost" id="reset"><span class="ico" data-i="unlock"></span>Снять все замки</button>
    <button class="ghost" id="unhide" hidden></button>
  </div>

  <div class="credits" id="credits"></div>
</div>
<div class="modal" id="modal" hidden><div class="sheet glass" role="dialog" aria-modal="true">
  <div class="sheethead"><h2 id="mTitle"></h2><button class="ib" id="mClose" aria-label="Закрыть"><span class="ico" data-i="x"></span></button></div>
  <div id="mBody"></div>
</div></div>
<datalist id="metrolist"></datalist>
<div class="toast" id="toast"></div>

<script src="firebase-config.js?v=2"></script>
<script>
'use strict';
// иконки: тонкие линии, как в системных приложениях
const IC = {
  heart:'<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
  heartf:'<path fill="currentColor" d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  spark:'<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/>',
  lock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  unlock:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 7.5-2"/>',
  shuffle:'<path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="M15 15l6 6"/><path d="M4 4l5 5"/>',
  eyeoff:'<path d="M3 3l18 18"/><path d="M10.6 5.1A10 10 0 0 1 12 5c5 0 9 4.5 10 7a13 13 0 0 1-3 4.2M6.6 6.6A13 13 0 0 0 2 12c1 2.5 5 7 10 7a10 10 0 0 0 4.4-1"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>',
  copy:'<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>',
  bookmark:'<path d="M6 3h12v18l-6-4-6 4z"/>',
  star:'<path fill="currentColor" d="m12 3 2.7 5.6 6.1.8-4.5 4.2 1.1 6.1L12 16.8 6.6 19.7l1.1-6.1L3.2 9.4l6.1-.8z"/>',
  pin:'<path d="M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
  ticket:'<path d="M3 8a2 2 0 0 0 0 4v0a2 2 0 0 1 0 4v2h18v-2a2 2 0 0 1 0-4 2 2 0 0 0 0-4V6H3z"/><path d="M14 6v12" stroke-dasharray="2 2"/>',
  fork:'<path d="M7 3v8a2 2 0 0 0 4 0V3M9 11v10"/><path d="M17 21V3c-2 1-3 4-3 7h3"/>',
  glass:'<path d="M6 3h12l-6 8z"/><path d="M12 11v9M8 21h8"/>',
  music:'<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
  film:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/>',
  pan:'<circle cx="10" cy="13" r="6"/><path d="M16 13h6"/>',
  dice:'<rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="9" cy="9" r="1" fill="currentColor"/><circle cx="15" cy="15" r="1" fill="currentColor"/><circle cx="15" cy="9" r="1" fill="currentColor"/><circle cx="9" cy="15" r="1" fill="currentColor"/>',
  quote:'<path d="M7 7h4v4c0 3-2 5-4 6M14 7h4v4c0 3-2 5-4 6"/>',
  locate:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="8"/>',
};
const icon = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]||''}</svg>`;
const SLOT_ICON = {go:'pin',event:'ticket',eat:'fork',music:'music',rule:'quote',watch:'film',food:'pan',do:'dice'};

const rub = n => n.toLocaleString('ru-RU').replace(/\u00a0/g,'\u202f');
function avgCheck(p){
  const t = CHECK[p.k]; if(!t) return '';
  let lvl = p.pl || (p.pc==null ? 2 : Math.max(1, p.pc));
  const c = p.c || '';
  if(p.k==='cafe' && /кофейня|выпечка|пончики|мороженое|бабл/.test(c) && !p.pl) lvl = 1;
  const r = t[Math.min(4, lvl)];
  return `≈ ${rub(r[0])}–${rub(r[1])} ₽`;
}

function dist(a,b,c,d){ const p=Math.PI/180, x=(d-b)*p*Math.cos((a+c)/2*p), y=(c-a)*p; return 6371*Math.sqrt(x*x+y*y); }
function radiusKm(){ return state.origin ? RADII.find(r=>r[0]===state.radius)[2] : 1e9; }
const seen = {}; // чтобы при перекручивании варианты не повторялись

// выбирает место: сначала категорию по весам, потом одно из подходящих в ней.
// opt.maxPc — потолок по тратам, opt.cuisine — подстроки кухни, opt.exclude — что точно не показывать
function pickPlace(weights, anchor, maxKm, slot, opt){
  opt = opt || {};
  const groups = {};
  for(const p of DATA.places){
    const w = weights[p.k]; if(!w) continue;
    const key = pkey(p);
    if(hidden.has(key) || key===opt.exclude) continue;
    if(opt.maxPc!=null && (p.pc==null ? 2 : p.pc) > opt.maxPc) continue;
    if(opt.onlyTop && !p.g) continue;
    if(state.who!=='family' && KIDS_RE.test(p.n)) continue;
    if(opt.cuisine && opt.cuisine.length && !(p.c && opt.cuisine.some(c=>p.c.includes(c)))) continue;
    if(anchor && maxKm<1e8 && dist(anchor.la,anchor.lo,p.la,p.lo)>maxKm) continue;
    (groups[p.k]=groups[p.k]||[]).push(p);
  }
  if(!Object.keys(groups).length) return null;
  if(opt.minPool && Object.values(groups).reduce((n,l)=>n+l.length,0) < opt.minPool) return null;
  const sset = seen[slot] = seen[slot] || new Set();
  // сначала то, что ещё не показывали ни сейчас, ни в прошлые визиты; потом то, что не показывали сейчас
  const pass = f => { const o = {}; for(const k in groups){ const l = groups[k].filter(f); if(l.length) o[k] = l; } return o; };
  let fresh = pass(p=>!sset.has(p) && !recentSet.has(pkey(p)));
  if(!Object.keys(fresh).length) fresh = pass(p=>!sset.has(p));
  if(!Object.keys(fresh).length){ sset.clear(); fresh = groups; }
  const ks = Object.keys(fresh);
  let total = ks.reduce((s,k)=>s+weights[k],0), r = Math.random()*total, kind = ks[0];
  for(const k of ks){ r-=weights[k]; if(r<=0){ kind=k; break; } }
  const list = fresh[kind].slice().sort((a,b)=>b.s-a.s);
  const picked = list.filter(x=>x.g), rest = list.filter(x=>!x.g);
  let p;
  if(picked.length && (!rest.length || Math.random() < .6)){
    const t1 = picked.filter(x=>x.gt===1), pool = t1.length && Math.random()<.25 ? t1 : picked;
    p = pool[Math.floor(Math.random()*pool.length)];
  } else {
    const top = rest.slice(0, Math.max(10, Math.min(150, Math.ceil(rest.length*.4))));
    p = top[Math.floor(Math.random()*top.length)];
  }
  sset.add(p); remember(p); return p;
}

const MSK = 3*3600;
function dayWindow(){
  const now = Math.floor(Date.now()/1000);
  const d = new Date((now+MSK)*1000);
  const start = Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate())/1000 - MSK; // полночь по Москве
  if(state.day==='today') return [now-1800, start+86400+4*3600, now];
  if(state.day==='tomorrow') return [start+86400, start+2*86400+4*3600, now];
  const wd = d.getUTCDay(); // 0 вс … 6 сб
  if(wd===6) return [now-1800, start+2*86400, now];
  if(wd===0) return [now-1800, start+86400, now];
  const sat = start+(6-wd)*86400; return [sat, sat+2*86400, now];
}
// возвращает подходящий сеанс события [start,end,long] или null
function eventSlot(e, win){
  for(const [s,en] of e.d){
    const long = en-s > 36*3600;
    if(long){ if(s<win[1] && en>Math.max(win[0],win[2])) return [s,en,true]; }
    else if(s>=win[0] && s<win[1]) return [s,en,false];
  }
  return null;
}
function pickEvent(anchor, maxKm){
  if(!DATA.events || !DATA.events.length) return null;
  const win = dayWindow(), mood = EVENT_MOOD[state.mood], ws = wantSets(), cands = [];
  for(const e of DATA.events){
    const sl = eventSlot(e, win); if(!sl) continue;
    if(state.budget==='free' && !e.fr) continue;
    if(state.budget==='low' && !e.fr && e.pf && e.pf>1500) continue;
    if(state.who==='family' && ((e.ag||0)>=16 || e.k.includes('party'))) continue;
    if(state.who!=='family' && !ws.events.has('kids') && e.k.every(k=>k==='kids')) continue;
    if(ws.on && !e.k.some(k=>ws.events.has(k))) continue;
    if(anchor && maxKm<1e8){ if(e.la==null || dist(anchor.la,anchor.lo,e.la,e.lo)>maxKm) continue; }
    let w = e.k.some(k=>mood.includes(k)) ? 3 : (e.k[0]==='other' ? .15 : .3);
    if(ws.on) w = Math.max(w, 1.5);
    if(state.who==='family' && e.k.includes('kids')) w = 3;
    if(sl[2]) w *= .6;                       // длинные выставки чуть реже, чем события «именно сегодня»
    cands.push({e, sl, w});
  }
  if(!cands.length) return null;
  const sset = seen.event = seen.event || new Set();
  let pool = cands.filter(c=>!sset.has(c.e)); if(!pool.length){ sset.clear(); pool = cands; }
  // сначала выбираем тип события по весам, потом случайное событие этого типа:
  // иначе сотни мастер-классов вытесняют редкие концерты и спектакли
  const groups = {};
  pool.forEach(c=>{ const k = c.e.k.find(x=>mood.includes(x)) || c.e.k[0]; const g = groups[k] = groups[k] || {w:0, list:[]}; g.w = Math.max(g.w, c.w); g.list.push(c); });
  const ks = Object.keys(groups);
  let r = Math.random()*ks.reduce((s,k)=>s+groups[k].w,0), kind = ks[0];
  for(const k of ks){ r-=groups[k].w; if(r<=0){ kind=k; break; } }
  const list = groups[kind].list, ch = list[Math.floor(Math.random()*list.length)];
  sset.add(ch.e); return ch;
}

function fits(item){
  const tags = item[2].split(' '), byDim = {};
  tags.forEach(t=>{const d=TAGS[t]; if(d){(byDim[d]=byDim[d]||[]).push(t);}});
  for(const d in byDim){ if(!byDim[d].includes(state[d])) return 0; }
  if(tags.includes('ACTIVE') && state.energy==='low') return 0;
  if(tags.includes('LAZY') && state.energy==='high' && Math.random()<.6) return 0;
  if(tags.includes('PRICEY') && state.budget!=='high') return 0;
  return byDim.mood ? 2 : 1;
}
function pickIdea(list, avoid){
  let pool = list.map(i=>[i,fits(i)]).filter(x=>x[1]>0);
  const strong = pool.filter(x=>x[1]===2);
  if(strong.length>=2) pool = strong;
  if(!pool.length) pool = list.map(i=>[i,1]);
  let cand = pool.filter(x=>!avoid||x[0][0]!==avoid);
  if(!cand.length) cand = pool;
  const it = cand[Math.floor(Math.random()*cand.length)][0];
  return {type:'idea', t:it[0], n:it[1], q:it[3]||''};
}
const hasData = ()=> !!(DATA && DATA.places && DATA.places.length);
function slots(){
  if(state.place==='home') return [['watch','Посмотреть'],['food','Поесть'],['do','Занятие'],['music','Фоном играет'],['rule','Правило вечера']];
  const s = [['go','Куда пойти']];
  if(hasData() && DATA.events && DATA.events.length) s.push(['event','Или событие']);
  s.push(['eat', state.venue==='bar' && state.who!=='family' ? 'Где выпить' : 'Где поесть'],['music','Плейлист в дорогу'],['rule','Правило вечера']);
  return s;
}
let current = {}, locks = {};
function anchorFor(k){
  // еду ищем рядом с выбранным местом, остальное — рядом с точкой пользователя
  if(k==='eat' && current.go && current.go.type==='place') return current.go.p;
  return state.origin;
}
const NOTHING = 'Под такие условия ничего не нашлось. Попробуйте увеличить бюджет или радиус либо снять часть пожеланий.';
function rollSlot(k){
  const prev = current[k];
  if(k==='go'){
    if(!hasData()){ current.go = pickIdea(DB.go, prev&&prev.t); return; }
    const w = activityWeights(), opt = {maxPc:maxPc(), exclude: prev && prev.type==='place' ? pkey(prev.p) : null};
    let p = pickPlace(w, state.origin, radiusKm(), 'go', opt), far = false;
    if(!p && state.origin && radiusKm()<1e8){ p = pickPlace(w, null, 1e9, 'go', opt); far = !!p; }
    current.go = p ? {type:'place', p, far} : {type:'none', msg:NOTHING};
  } else if(k==='eat'){
    if(!hasData()){ current.eat = pickIdea(DB.eatout, prev&&prev.t); return; }
    const a = anchorFor('eat'), w = foodWeights();
    const opt = {maxPc: state.budget==='high' ? 3 : (state.budget==='low' && state.onlyTop ? 2 : 1), cuisine: cuisineKeys(), onlyTop: state.onlyTop,
                 exclude: prev && prev.type==='place' ? pkey(prev.p) : null};
    const steps = a ? (current.go && current.go.type==='place' ? [1.2,2.5,5,1e9] : [radiusKm(),1e9]) : [1e9];
    let p = null;
    for(let i=0; i<steps.length; i++){
      p = pickPlace(w, a, steps[i], 'eat', Object.assign({}, opt, {minPool: i<steps.length-1 ? 6 : 0}));
      if(p) break;
    }
    current.eat = p ? {type:'place', p} : {type:'none', msg:NOTHING};
  } else if(k==='event'){
    let c = pickEvent(state.origin, radiusKm());
    if(!c && state.origin && radiusKm()<1e8) c = pickEvent(null, 1e9);
    current.event = c ? {type:'event', e:c.e, sl:c.sl} : {type:'none', msg:'На этот день в афише не нашлось ничего под ваши условия. Попробуйте другой день, бюджет или пожелания.'};
  } else {
    current[k] = pickIdea(DB[k], prev&&prev.t);
  }
}
function generate(){
  const ss = slots().map(s=>s[0]);
  ss.forEach(k=>{ if(!locks[k] || !current[k]) rollSlot(k); });
  render(true);
}

const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https?:\/\//i.test(u||'') ? u : '';
function yandex(p){
  const kind = (KIND[p.k]||'').toLowerCase().replace(/ или .*$/,'');
  const q = encodeURIComponent(`${kind} ${p.n}, ${p.a ? 'Москва, '+p.a : 'Москва'}`);
  return `https://yandex.ru/maps/?text=${q}&ll=${p.lo}%2C${p.la}&z=17&mode=search`;
}
function hoursRu(h){
  if(!h) return '';
  if(/^24\/7$/.test(h.trim())) return 'круглосуточно';
  const map = {Mo:'пн',Tu:'вт',We:'ср',Th:'чт',Fr:'пт',Sa:'сб',Su:'вс',PH:'праздники',off:'выходной',closed:'закрыто'};
  let s = h.replace(/\b(Mo|Tu|We|Th|Fr|Sa|Su|PH|off|closed)\b/g, m=>map[m]).replace(/-/g,'–').replace(/;\s*/g,'; ');
  return s.length>70 ? s.slice(0,68)+'…' : s;
}
function kmText(km){ return km<1 ? Math.round(km*100)*10+' м' : km.toFixed(1).replace('.',',')+' км'; }
function fmtWhen(sl){
  const tz = {timeZone:'Europe/Moscow'};
  if(sl[2]) return 'идёт до '+new Date(sl[1]*1000).toLocaleDateString('ru-RU',Object.assign({day:'numeric',month:'long'},tz));
  const d = new Date(sl[0]*1000);
  return d.toLocaleDateString('ru-RU',Object.assign({weekday:'short',day:'numeric',month:'long'},tz))+', '+
         d.toLocaleTimeString('ru-RU',Object.assign({hour:'2-digit',minute:'2-digit'},tz));
}

document.getElementById('out').addEventListener('click',e=>{

  rollSlot(k);

  render(false);

ctl.addEventListener('click',e=>{
  const c = e.target.closest('.chip'); if(!c) return;
  if(c.id==='geo'){
    if(!navigator.geolocation){ toast('Браузер не умеет определять местоположение'); return; }
    toast('Определяю, где вы…');

      pos=>{ setOrigin({name:'ваше местоположение', la:pos.coords.latitude, lo:pos.coords.longitude}); toast('Готово, ищу рядом с вами'); },
      ()=>toast('Не получилось определить место. Выберите станцию метро'), {timeout:8000, maximumAge:600000});

};
Store.load();
const SLOT_NAME = {go:'Куда пойти',event:'Событие',eat:'Где поесть',watch:'Посмотреть',food:'Поесть',do:'Занятие',music:'Музыка',rule:'Правило вечера'};
// превращает карточку в запись для избранного
function itemOf(k){
  const it = current[k]; if(!it) return null;
  if(it.type==='place'){ const p = it.p;
    return {id:'p:'+pkey(p), kind:'place', slot:k, title:p.n, sub:[KIND[p.k], p.a, p.m?'м. '+p.m:''].filter(Boolean).join(' · '), url:yandex(p), p}; }
  if(it.type==='event'){ const e = it.e;
    return {id:'e:'+e.u, kind:'event', slot:k, title:e.t, sub:[fmtWhen(it.sl), e.p].filter(Boolean).join(' · '), url:e.u}; }
  if(it.type==='idea') return {id:'i:'+k+':'+it.t, kind:'idea', slot:k, title:it.t, sub:it.n, q:it.q||''};
  return null;
}
const isFav = x => !!x && Store.data.favs.some(f=>f.id===x.id);
function toggleFav(x){
  if(!x) return;
  if(isFav(x)){ Store.data.favs = Store.data.favs.filter(f=>f.id!==x.id); toast('Убрано из избранного'); }
  else { Store.data.favs.unshift(Object.assign({ts:Date.now()}, x)); toast('Добавлено в избранное'); }
  Store.save();
}
function updateFavCount(){ const n = Store.data.favs.length + Store.data.plans.length; document.getElementById('favCount').textContent = n ? `(${n})` : ''; }
function planText(){
  return slots().map(([k,t])=>{
    const it = current[k]; if(!it || it.type==='none') return '';
    const head = t;
    if(it.type==='place') return `${head}: ${it.p.n}${it.p.a?' ('+it.p.a+')':''}${it.p.m?', м. '+it.p.m:''}`;
    if(it.type==='event') return `${head}: ${it.e.t}. ${fmtWhen(it.sl)}`;
    return `${head}: ${it.t}`;
  }).filter(Boolean).join('\n');
}
document.getElementById('savePlan').onclick = ()=>{
  if(!Object.keys(current).length) return;
  const d = new Date().toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
  const mood = DIMS[1].opts.find(o=>o[0]===state.mood)[1], where = state.place==='home' ? 'дома' : 'в городе';
  Store.data.plans.unshift({id:'v:'+Date.now(), ts:Date.now(), title:`${d}: ${mood.toLowerCase()} ${where}`, text:planText(),
    items:slots().map(([k])=>itemOf(k)).filter(Boolean)});
  Store.save(); toast('Вечер сохранён в избранном');
};

// ---------- окно
const modal = document.getElementById('modal');
function openModal(title, html){ document.getElementById('mTitle').textContent = title; document.getElementById('mBody').innerHTML = html; modal.hidden = false; }
function closeModal(){ modal.hidden = true; }
document.getElementById('mClose').onclick = closeModal;
modal.addEventListener('click', e=>{ if(e.target===modal) closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && !modal.hidden) closeModal(); });

let favTab = 'places';
function favLink(f){
  if(f.url) return `<a href="${esc(f.url)}" target="_blank" rel="noopener">${f.kind==='event'?'Подробнее':'На карте'}</a>`;
  if(f.slot==='music' && f.q) return `<a href="https://music.yandex.ru/search?text=${encodeURIComponent(f.q)}" target="_blank" rel="noopener">Слушать</a>`;
  return '';
}
function drawFav(){
  const F = Store.data.favs;
  const lists = {places:F.filter(f=>f.kind!=='idea'), ideas:F.filter(f=>f.kind==='idea'), plans:Store.data.plans};
  const tab = (id, label) => `<button class="chip" data-tab="${id}" aria-pressed="${favTab===id}">${label} (${lists[id].length})</button>`;
  let h = `<div class="tabs seg">${tab('places','Места и события')}${tab('ideas','Идеи')}${tab('plans','Вечера')}</div>`;
  const L = lists[favTab];
  if(!L.length) h += `<p class="muted">Пока пусто. Нажмите на сердечко на карточке${favTab==='plans'?' или «Сохранить вечер» под планом':''}, и оно появится здесь.</p>`;
  h += L.map(f=> favTab==='plans'
    ? `<div class="fitem"><div><div class="ft">${esc(f.title)}</div><div class="fs">${esc(f.text)}</div></div><button class="ib" data-del="${esc(f.id)}" aria-label="Удалить">${icon('x')}</button></div>`
    : `<div class="fitem"><div><div class="ft">${esc(f.title)}</div><div class="fs">${esc(SLOT_NAME[f.slot]||'')}${f.sub?', '+esc(f.sub):''}</div>${favLink(f)}</div><button class="ib" data-del="${esc(f.id)}" aria-label="Удалить">${icon('x')}</button></div>`).join('');
  openModal('Избранное', h);
}
document.getElementById('openFav').onclick = drawFav;
document.getElementById('mBody').addEventListener('click', e=>{
  const t = e.target.closest('[data-tab]'); if(t){ favTab = t.dataset.tab; drawFav(); return; }
  const d = e.target.closest('[data-del]');
  if(d){ const id = d.dataset.del; Store.data.favs = Store.data.favs.filter(f=>f.id!==id); Store.data.plans = Store.data.plans.filter(f=>f.id!==id); Store.save(); drawFav(); if(Object.keys(current).length) render(false); return; }
  const a = e.target.closest('[data-set]'); if(a) settingsAction(a.dataset.set);
});

// ---------- настройки
function drawSettings(){
  const hasMetro = DATA && DATA.metro && DATA.metro.length;
  openModal('Настройки', `
    <h3>Аккаунт</h3>
    ${accountHtml()}
    <p class="muted" style="margin-top:10px">Выбранные параметры вечера (компания, настроение, бюджет, кухня и так далее) запоминаются сами.</p>
    <h3>Ищу места рядом с</h3>
    <div class="field">${hasMetro?`<input id="setMetro" list="metrolist" placeholder="станция метро" value="${esc(state.origin&&state.origin.metro?state.origin.name.replace(/^м\. /,''):'')}">`:''}
      <button class="chip" data-set="metro">Сохранить</button><button class="chip" data-set="nometro">Вся Москва</button></div>
    <h3>Скрытые места</h3>
    <div class="field"><span class="muted">Убрано из подбора: ${hidden.size}</span>${hidden.size?'<button class="chip" data-set="unhide">Вернуть все</button>':''}</div>
    <h3>Перенос на другое устройство</h3>
    <p class="muted">Скопируйте код и вставьте его на другом телефоне или компьютере. Перенесутся избранное, сохранённые вечера, скрытые места и параметры.</p>
    <div class="field"><button class="chip" data-set="export">Скопировать код</button></div>
    <div class="field"><textarea id="importCode" placeholder="Вставьте код с другого устройства"></textarea></div>
    <div class="field"><button class="chip" data-set="import">Загрузить из кода</button></div>
    <h3>Сброс</h3>
    <div class="field"><button class="chip" data-set="reset">Сбросить параметры вечера</button><button class="chip" data-set="wipe">Удалить все мои данные</button></div>`);
}
document.getElementById('openSet').onclick = drawSettings;
document.getElementById('openAcc').onclick = drawSettings;
function updateAccButton(){ const b = document.getElementById('openAcc'); b.hidden = !Account.enabled; document.getElementById('accLbl').textContent = Account.user ? (Account.user.email||'Аккаунт').split('@')[0] : 'Войти'; }

const b64e = s => btoa(unescape(encodeURIComponent(s))), b64d = s => decodeURIComponent(escape(atob(s)));
let wipeArmed = false;
async function settingsAction(a){
  if(['login','signup','google','resetpass','logout'].includes(a)){
    if(window.accountAction) window.accountAction(a, (document.getElementById('accEmail')||{}).value||'', (document.getElementById('accPass')||{}).value||'');
    else toast('Вход ещё загружается, попробуйте через пару секунд');
    return;
  }
  if(a==='metro'){
    const el = document.getElementById('setMetro'); if(!el) return;
    const v = el.value.trim().toLowerCase().replace(/ё/g,'е'), norm = x=>x.toLowerCase().replace(/ё/g,'е');
    const m = DATA.metro.find(x=>norm(x[0])===v) || DATA.metro.find(x=>norm(x[0]).startsWith(v));
    if(m){ setOrigin({name:'м. '+m[0], metro:1, la:m[1], lo:m[2]}); toast('Буду искать рядом с м. '+m[0]); drawSettings(); } else toast('Не нашёл такую станцию');
  } else if(a==='nometro'){ setOrigin(null); toast('Ищу по всей Москве'); drawSettings(); }
  else if(a==='unhide'){ hidden.clear(); saveHidden(); toast('Скрытые места снова в подборе'); drawSettings(); }
  else if(a==='export'){
    const code = b64e(JSON.stringify({v:1, user:Store.data, hidden:[...hidden], state}));
    try{ await navigator.clipboard.writeText(code); toast('Код скопирован'); }
    catch(e){ document.getElementById('importCode').value = code; toast('Скопируйте код из поля ниже'); }
  } else if(a==='import'){
    try{
      const d = JSON.parse(b64d(document.getElementById('importCode').value.trim()));
      if(!d || d.v!==1) throw 0;
      const ids = new Set(Store.data.favs.map(f=>f.id)), pids = new Set(Store.data.plans.map(f=>f.id));
      Store.data.favs = Store.data.favs.concat((d.user.favs||[]).filter(f=>!ids.has(f.id)));
      Store.data.plans = Store.data.plans.concat((d.user.plans||[]).filter(f=>!pids.has(f.id)));
      Store.save(); (d.hidden||[]).forEach(x=>hidden.add(x)); saveHidden();
      Object.assign(state, d.state||{}); save(); drawControls();
      toast('Данные загружены'); drawSettings();
    }catch(e){ toast('Код не подошёл. Скопируйте его целиком'); }
  } else if(a==='reset'){
    Object.assign(state, {who:'duo',mood:'cozy',energy:'mid',budget:'low',place:'out',day:'today',radius:'any',origin:null,want:[],cuisine:'any',onlyTop:false,venue:'any'});
    save(); drawControls(); toast('Параметры сброшены'); drawSettings();
  } else if(a==='wipe'){
    if(!wipeArmed){ wipeArmed = true; toast('Нажмите ещё раз, чтобы удалить избранное, вечера и скрытые места'); setTimeout(()=>wipeArmed=false, 4000); return; }
    wipeArmed = false; Store.data = {favs:[], plans:[]}; Store.save(); hidden.clear(); saveHidden();
    toast('Все данные удалены'); drawSettings(); if(Object.keys(current).length) render(false);
  }
}
updateFavCount();

// ---------- обмен данными с облаком (используется модулем аккаунтов ниже)
window.Vecher = {
  getUserData(){ return {favs:Store.data.favs.slice(0,500), plans:Store.data.plans.slice(0,100), hidden:[...hidden], state:JSON.parse(JSON.stringify(state))}; },
  // объединение при входе: ничего не теряем ни с устройства, ни из облака
  merge(local, cloud){
    if(!cloud) return local;
    const uni = (a,b)=>{ const ids = new Set(a.map(x=>x.id)); return a.concat(b.filter(x=>!ids.has(x.id))); };
    return {favs:uni(cloud.favs||[], local.favs||[]).sort((x,y)=>(y.ts||0)-(x.ts||0)),
            plans:uni(cloud.plans||[], local.plans||[]).sort((x,y)=>(y.ts||0)-(x.ts||0)),
            hidden:[...new Set([...(cloud.hidden||[]), ...(local.hidden||[])])],
            state:Object.assign({}, local.state, cloud.state||{})};
  },
  // применить данные из облака, не отправляя их обратно
  apply(d){
    const keep = window.onUserDataChange; window.onUserDataChange = null;
    try{
      Store.data = {favs:d.favs||[], plans:d.plans||[]}; Store.save();
      hidden = new Set(d.hidden||[]); saveHidden();
      if(d.state){ Object.assign(state, d.state); if(!Array.isArray(state.want)) state.want = []; save(); }
      drawControls(); if(Object.keys(current).length) render(false);
    } finally { window.onUserDataChange = keep; }
  },
  toast, drawSettings,
};
const Account = { enabled: !!window.FIREBASE_CONFIG, user: null, busy: false };
window.Vecher.setUser = u => { Account.user = u; updateAccButton(); if(!modal.hidden && document.getElementById('mTitle').textContent==='Настройки') drawSettings(); };
updateAccButton();
function accountHtml(){
  if(!Account.enabled) return `<p class="muted">Вход и синхронизация пока не подключены. Чтобы перенести данные, используйте код ниже.</p>`;
  if(Account.user) return `<p class="muted">Вы вошли как <b>${esc(Account.user.email||Account.user.displayName||'пользователь')}</b>. Избранное, вечера, скрытые места и параметры синхронизируются на всех устройствах, где вы вошли.</p>
    <div class="field"><button class="chip" data-set="logout">Выйти</button></div>`;
  return `<p class="muted">Войдите, чтобы избранное и настройки были на всех ваших устройствах. Всё, что уже сохранено в этом браузере, перенесётся в аккаунт.</p>
    <div class="field"><input id="accEmail" type="email" placeholder="почта" autocomplete="email"><input id="accPass" type="password" placeholder="пароль, от 6 символов" autocomplete="current-password"></div>
    <div class="field"><button class="chip" data-set="login">Войти</button><button class="chip" data-set="signup">Зарегистрироваться</button><button class="chip" data-set="google">Войти через Google</button><button class="chip" data-set="resetpass">Забыли пароль?</button></div>`;
}

let toastTimer;
function toast(m){ const t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove('show'),2200); }

// ---------- загрузка базы ----------
function credits(){
  let h = '';
  if(hasData()){
    const d = new Date(DATA.updated);
    const when = isNaN(d) ? '' : d.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});
    h += `Мест в базе: ${DATA.places.length.toLocaleString("ru-RU")} · событий: ${(DATA.events||[]).length.toLocaleString("ru-RU")}${when?' · обновлено '+when:''}<br>`;
  }
  h += 'Места: © участники <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> (ODbL), события: <a href="https://www.mos.ru/afisha/" target="_blank" rel="noopener">афиша mos.ru</a><br>Значком со звездой отмечены места из гидов Ultima Guide, премии WhereToEat и подборок «Афиши Daily». У остальных оценок нет, а часть могла закрыться. Перед выходом проверьте место по ссылке на карты. Кнопка с перечёркнутым глазом убирает место из подбора.';
  document.getElementById('credits').innerHTML = h;
}
function banner(){
  const b = document.getElementById('banner');
  if(!hasData()) b.innerHTML = '<div class="banner">База мест пока не загрузилась, поэтому для города показываю общие идеи. Режим «Дома» работает полностью.</div>';
  else if(DATA.demo) b.innerHTML = '<div class="banner">Сейчас в базе демо-набор из нескольких десятков известных мест. Полная база Москвы появится после первого автоматического обновления.</div>';
  else b.innerHTML = '';
}
function init(){
  const t = document.getElementById('today');
  if(t){ const d = new Date().toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long',timeZone:'Europe/Moscow'}); t.textContent = d[0].toUpperCase()+d.slice(1)+'. Реальные места и события Москвы, ссылки на отзывы и афишу.'; }
  paintIcons();
  if(DATA && DATA.metro) document.getElementById('metrolist').innerHTML = DATA.metro.map(m=>`<option value="${esc(m[0])}">`).join('');
  if(state.origin && state.origin.metro && !(DATA && DATA.metro && DATA.metro.length)) state.origin = null;
  drawControls(); banner(); credits();
}
init();
fetch('data/places.json', {cache:'no-cache'})
  .then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(d=>{ if(d && Array.isArray(d.places)){ DATA = d; init(); } })
  .catch(()=>{});
</script>
<script type="module">
// Аккаунты и синхронизация через Firebase. Включаются, только если заполнен firebase-config.js.
const cfg = window.FIREBASE_CONFIG;
if(cfg){
  const V = 'https://www.gstatic.com/firebasejs/10.12.2/';
  try{
    const {initializeApp} = await import(V+'firebase-app.js');
    const A = await import(V+'firebase-auth.js');
    const F = await import(V+'firebase-firestore.js');
    const app = initializeApp(cfg), auth = A.getAuth(app), db = F.getFirestore(app);
    auth.languageCode = 'ru';
    let unsub = null, timer = null, lastSent = '';
    const ERR = {
      'auth/invalid-email':'Почта указана неверно', 'auth/missing-password':'Введите пароль',
      'auth/weak-password':'Пароль слишком короткий, нужно от 6 символов', 'auth/email-already-in-use':'Такая почта уже зарегистрирована, нажмите «Войти»',
      'auth/invalid-credential':'Неверная почта или пароль', 'auth/user-not-found':'Такой почты нет, нажмите «Зарегистрироваться»',
      'auth/wrong-password':'Неверный пароль', 'auth/too-many-requests':'Слишком много попыток, подождите немного',
      'auth/popup-closed-by-user':'Окно входа закрыто', 'auth/network-request-failed':'Нет связи с сервером входа',
      'auth/unauthorized-domain':'Этот адрес сайта не разрешён в настройках Firebase',
    };
    const say = e => window.Vecher.toast(ERR[e && e.code] || ('Ошибка: '+((e && e.code) || e)));
    const push = () => {
      const u = auth.currentUser; if(!u) return;
      clearTimeout(timer);
      timer = setTimeout(async ()=>{
        const d = window.Vecher.getUserData(), js = JSON.stringify(d);
        if(js===lastSent) return; lastSent = js;
        try{ await F.setDoc(F.doc(db,'users',u.uid), Object.assign(d, {updated:F.serverTimestamp()})); }
        catch(e){ console.warn('sync', e); }
      }, 800);
    };
    window.accountAction = async (a, email, pass) => {
      try{
        if(a==='login') await A.signInWithEmailAndPassword(auth, email.trim(), pass);
        else if(a==='signup') await A.createUserWithEmailAndPassword(auth, email.trim(), pass);
        else if(a==='google') await A.signInWithPopup(auth, new A.GoogleAuthProvider());
        else if(a==='resetpass'){ await A.sendPasswordResetEmail(auth, email.trim()); window.Vecher.toast('Письмо для смены пароля отправлено'); }
        else if(a==='logout'){ await A.signOut(auth); window.Vecher.toast('Вы вышли. Данные остались в этом браузере'); }
      }catch(e){ say(e); }
    };
    A.onAuthStateChanged(auth, async u => {
      if(unsub){ unsub(); unsub = null; }
      window.onUserDataChange = null;
      window.Vecher.setUser(u);
      if(!u) return;
      const ref = F.doc(db,'users',u.uid);
      try{
        const snap = await F.getDoc(ref);
        const merged = window.Vecher.merge(window.Vecher.getUserData(), snap.exists() ? snap.data() : null);
        window.Vecher.apply(merged);
        lastSent = JSON.stringify(window.Vecher.getUserData());
        await F.setDoc(ref, Object.assign(window.Vecher.getUserData(), {updated:F.serverTimestamp()}));
        window.Vecher.toast('Вход выполнен, данные синхронизированы');
      }catch(e){ console.warn(e); window.Vecher.toast('Не удалось загрузить данные из аккаунта'); }
      window.onUserDataChange = push;
      // изменения с других устройств
      unsub = F.onSnapshot(ref, s => {
        if(!s.exists() || s.metadata.hasPendingWrites) return;
        const d = s.data(), mine = JSON.stringify(window.Vecher.getUserData());
        const theirs = JSON.stringify({favs:d.favs||[], plans:d.plans||[], hidden:d.hidden||[], state:d.state||{}});
        if(theirs!==mine){ lastSent = theirs; window.Vecher.apply(d); }
      });
    });
  }catch(e){
    console.warn('Firebase не загрузился', e);
    window.Vecher.toast('Сервис входа сейчас недоступен. Избранное сохраняется в этом браузере');
  }
}
</script>
